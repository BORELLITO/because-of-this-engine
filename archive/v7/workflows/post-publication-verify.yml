name: Because Of This V7.1 post-publication G11

on:
  workflow_dispatch:
    inputs:
      record:
        description: "V7 production record path"
        required: true
        type: string
      receipt:
        description: "Manual publication receipt JSON path"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate V7 manual publication receipt
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/v7_post_publication.py \
            --record "${{ inputs.record }}" --receipt "${{ inputs.receipt }}"
      - name: Print G11 completion
        run: echo "G11_MANUAL_PUBLICATION_PASS"
