name: One-off GitHub storage cleanup

on:
  push:
    paths:
      - ".github/workflows/one-off-storage-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit and remove processed artifacts
        uses: actions/github-script@v7
        env:
          REPORT_PATH: storage_cleanup_report.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const now = Date.now();
            const minAgeMs = 2 * 60 * 60 * 1000;
            const protectedName = /(release|backup|permanent|keep)/i;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            let caches = [];
            try {
              caches = await github.paginate(
                github.rest.actions.getActionsCacheList,
                { owner, repo, per_page: 100 }
              );
            } catch (error) {
              core.warning(`Could not enumerate caches: ${error.message}`);
            }

            const beforeBytes = artifacts.reduce((s, a) => s + (a.size_in_bytes || 0), 0);
            const cacheBytes = caches.reduce((s, c) => s + (c.size_in_bytes || 0), 0);

            const runCache = new Map();
            const deleted = [];
            const kept = [];

            for (const artifact of artifacts) {
              const ageMs = now - new Date(artifact.created_at).getTime();
              const base = {
                id: artifact.id,
                name: artifact.name,
                size_in_bytes: artifact.size_in_bytes || 0,
                created_at: artifact.created_at,
                expires_at: artifact.expires_at,
                expired: artifact.expired,
                workflow_run_id: artifact.workflow_run?.id || null,
              };

              if (protectedName.test(artifact.name || '')) {
                kept.push({ ...base, reason: 'protected-name' });
                continue;
              }

              if (ageMs < minAgeMs && !artifact.expired) {
                kept.push({ ...base, reason: 'recent-under-2h' });
                continue;
              }

              let shouldDelete = Boolean(artifact.expired);
              let reason = artifact.expired ? 'expired' : '';
              let run = null;

              const runId = artifact.workflow_run?.id;
              if (!shouldDelete && runId) {
                if (!runCache.has(runId)) {
                  try {
                    const response = await github.rest.actions.getWorkflowRun({
                      owner, repo, run_id: runId
                    });
                    runCache.set(runId, response.data);
                  } catch (error) {
                    runCache.set(runId, { lookup_error: error.status || error.message });
                  }
                }
                run = runCache.get(runId);
                if (run?.status === 'completed' && run?.conclusion === 'success') {
                  shouldDelete = true;
                  reason = 'successful-completed-run';
                }
              }

              if (!shouldDelete && !runId && ageMs >= 7 * 24 * 60 * 60 * 1000) {
                shouldDelete = true;
                reason = 'orphan-older-than-7d';
              }

              if (shouldDelete) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner, repo, artifact_id: artifact.id
                  });
                  deleted.push({
                    ...base,
                    reason,
                    run_status: run?.status || null,
                    run_conclusion: run?.conclusion || null,
                  });
                } catch (error) {
                  kept.push({ ...base, reason: `delete-failed:${error.status || error.message}` });
                }
              } else {
                kept.push({
                  ...base,
                  reason: run?.status === 'completed'
                    ? `run-conclusion-${run?.conclusion || 'unknown'}`
                    : (run?.status ? `run-${run.status}` : 'not-proven-processed'),
                });
              }
            }

            const afterArtifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const afterBytes = afterArtifacts.reduce((s, a) => s + (a.size_in_bytes || 0), 0);

            const report = {
              generated_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              policy: {
                delete: [
                  'expired artifacts',
                  'artifacts older than 2h from successful completed workflow runs',
                  'orphan artifacts older than 7d'
                ],
                preserve: [
                  'names containing release, backup, permanent or keep',
                  'artifacts newer than 2h',
                  'failed/cancelled/in-progress/unproven artifacts'
                ],
                caches: 'audited only; not deleted'
              },
              artifacts_before: {
                count: artifacts.length,
                total_bytes: beforeBytes
              },
              artifacts_deleted: {
                count: deleted.length,
                total_bytes: deleted.reduce((s, a) => s + a.size_in_bytes, 0),
                items: deleted
              },
              artifacts_kept: {
                count: kept.length,
                total_bytes: kept.reduce((s, a) => s + a.size_in_bytes, 0),
                items: kept
              },
              artifacts_after: {
                count: afterArtifacts.length,
                total_bytes: afterBytes
              },
              caches: {
                count: caches.length,
                total_bytes: cacheBytes,
                items: caches.map(c => ({
                  id: c.id,
                  key: c.key,
                  ref: c.ref,
                  size_in_bytes: c.size_in_bytes || 0,
                  created_at: c.created_at,
                  last_accessed_at: c.last_accessed_at
                }))
              }
            };

            fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify(report, null, 2) + '\n');
            core.summary
              .addHeading('Storage cleanup')
              .addRaw(`Artifacts before: ${artifacts.length} (${beforeBytes} bytes)\n`)
              .addRaw(`Deleted: ${deleted.length} (${report.artifacts_deleted.total_bytes} bytes)\n`)
              .addRaw(`Artifacts after: ${afterArtifacts.length} (${afterBytes} bytes)\n`)
              .addRaw(`Caches audited: ${caches.length} (${cacheBytes} bytes)\n`);
            await core.summary.write();

      - name: Commit cleanup report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage_cleanup_report.json
          git commit -m "chore: add one-off storage cleanup report" || exit 0
          git push
