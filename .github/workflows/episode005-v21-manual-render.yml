name: Because Of This V2.1 Manual Render Gate

# This workflow is intentionally manual-only. It validates the explicit V2.1
# render boundary and fails closed while production_enablement is false.
on:
  workflow_dispatch:
    inputs:
      record_path:
        description: "V2.1 production record path"
        required: true
        default: "episodes/episode-005/production-record.json"
        type: string
      mode:
        description: "Preflight mode"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - final

permissions:
  contents: read

jobs:
  manual-render-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install thumbnail QA dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Compile manual V2.1 render gate
        run: python -m py_compile production/render_v21_manual.py production/canonical_entrypoint.py

      - name: Run fail-closed render preflight
        run: |
          PYTHONPATH=. python production/render_v21_manual.py \
            --record "${{ inputs.record_path }}" \
            --repo-root . \
            --mode "${{ inputs.mode }}"
