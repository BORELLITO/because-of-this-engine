name: Because Of This Episode 005 Global Visual Fingerprint Audit

# This audit is read-only and fail-closed. It verifies downloaded candidates
# against the immutable global registry without promoting or mutating anything.
on:
  workflow_dispatch:
    inputs:
      candidate_ids:
        description: "Comma or newline separated IDs from asset-acquisition-plan.json for this batch"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install media tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Compute and compare fingerprints
        env:
          CANDIDATE_IDS: ${{ inputs.candidate_ids }}
        run: |
          mkdir -p artifacts/episode005-visual-fingerprint
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          from production.asset_reuse_brain import source_asset_key
          from production.visual_provider_policy import PROVIDER_POLICIES, host_allowed, policy_for
          from production.video_asset_contract import FINGERPRINT_ALGORITHM, ffprobe, perceptual_hash, sha256_file

          root = Path("artifacts/episode005-visual-fingerprint")
          plan = json.loads(Path("episodes/episode-005/visual/asset-acquisition-plan.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("episodes/asset-memory-registry.json").read_text(encoding="utf-8"))

          requested_ids = [
              item.strip()
              for item in os.environ.get("CANDIDATE_IDS", "").replace("\n", ",").split(",")
              if item.strip()
          ]
          blockers = []
          if not requested_ids:
              raise SystemExit("candidate_ids input must contain at least one ID")
          if len(requested_ids) != len(set(requested_ids)):
              blockers.append({
                  "type": "duplicate_requested_candidate_id",
                  "candidate_ids": requested_ids,
              })
          if not all(re.fullmatch(r"[A-Za-z0-9._-]+", item) for item in requested_ids):
              blockers.append({
                  "type": "unsafe_candidate_id",
                  "candidate_ids": requested_ids,
              })

          indexed = {
              str(item.get("candidate_id")): item
              for item in plan.get("candidates", [])
              if isinstance(item, dict) and str(item.get("candidate_id", "")).strip()
          }
          candidates = []
          for candidate_id in requested_ids:
              candidate = indexed.get(candidate_id)
              if candidate is None:
                  blockers.append({
                      "type": "candidate_not_in_plan",
                      "candidate_id": candidate_id,
                  })
                  continue
              if str(candidate.get("rights_status", "")).startswith("REJECTED"):
                  blockers.append({
                      "type": "candidate_rejected_in_plan",
                      "candidate_id": candidate_id,
                      "rights_status": candidate.get("rights_status"),
                  })
                  continue
              if not candidate.get("intake_artifact"):
                  blockers.append({
                      "type": "candidate_missing_intake_artifact",
                      "candidate_id": candidate_id,
                  })
                  continue
              provider = str(candidate.get("provider", ""))
              policy = policy_for(provider)
              if policy is None or candidate.get("license_name") != policy["license_name"]:
                  blockers.append({
                      "type": "candidate_rights_drift",
                      "candidate_id": candidate_id,
                      "provider": candidate.get("provider"),
                      "license_name": candidate.get("license_name"),
                  })
                  continue
              candidates.append(candidate)

          registry_schema = registry.get("schema_version")
          if registry_schema not in {1, 2}:
              blockers.append({"type": "registry_schema", "value": registry_schema})
          registry_assets = registry.get("assets")
          if not isinstance(registry_assets, list):
              blockers.append({"type": "registry_assets", "value": "not_a_list"})
              registry_assets = []

          def values(field: str) -> set[str]:
              return {
                  str(asset.get(field, "")).strip().lower()
                  for asset in registry_assets
                  if isinstance(asset, dict) and str(asset.get(field, "")).strip()
              }

          registry_sha = values("sha256")
          registry_phash = values("perceptual_hash") | values("animation_fingerprint")
          registry_sources = values("source_asset_key")
          reports = []
          seen = {
              "sha256": set(),
              "perceptual_hash": set(),
              "source_asset_key": set(),
          }

          for candidate in candidates:
              candidate_id = str(candidate.get("candidate_id", ""))
              expected = {
                  "source_page_url": str(candidate.get("source_page_url", "")).strip(),
                  "media_url": str(candidate.get("media_url", "")).strip(),
              }
              if not expected["source_page_url"] or not expected["media_url"]:
                  blockers.append({"type": "candidate_source_incomplete", "candidate_id": candidate_id})
                  continue
              provider = str(candidate.get("provider", ""))
              policy = PROVIDER_POLICIES.get(provider)
              source_page = urlparse(expected["source_page_url"])
              media_url = urlparse(expected["media_url"])
              if not (
                  policy is not None
                  and source_page.scheme == "https"
                  and host_allowed(source_page.hostname, policy["page_hosts"])
                  and media_url.scheme == "https"
                  and host_allowed(media_url.hostname, policy["media_hosts"])
              ):
                  blockers.append({
                      "type": "candidate_domain_invalid",
                      "candidate_id": candidate_id,
                      "source_page_url": expected["source_page_url"],
                      "media_url": expected["media_url"],
                  })
                  continue

              intake = candidate.get("intake_artifact") or {}
              expected_sha = str(intake.get("sha256", "")).lower()
              media_path = root / f"{candidate_id}.mp4"
              request = urllib.request.Request(
                  expected["media_url"],
                  headers={"User-Agent": "because-of-this-fingerprint-audit/1.0"},
              )
              max_bytes = 200 * 1024 * 1024
              with urllib.request.urlopen(request, timeout=180) as response, media_path.open("wb") as handle:
                  content_length = response.headers.get("Content-Length")
                  if content_length and int(content_length) > max_bytes:
                      raise RuntimeError(f"candidate exceeds 200 MiB: {candidate_id}")
                  written = 0
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      written += len(chunk)
                      if written > max_bytes:
                          raise RuntimeError(f"candidate exceeds 200 MiB: {candidate_id}")
                      handle.write(chunk)
              actual_sha = sha256_file(media_path)
              if actual_sha != expected_sha:
                  blockers.append({
                      "type": "sha256_drift",
                      "candidate_id": candidate_id,
                      "expected": expected_sha,
                      "actual": actual_sha,
                  })

              metadata = ffprobe(media_path)
              duration = float(metadata["duration"])
              if not 0 < duration <= 180:
                  blockers.append({
                      "type": "candidate_duration_out_of_bounds",
                      "candidate_id": candidate_id,
                      "duration_seconds": duration,
                  })
                  continue
              phash = perceptual_hash(media_path, duration=duration)
              identity = {
                  "provider": candidate.get("provider"),
                  "provider_asset_id": candidate_id.rsplit("-", 1)[-1],
                  "source_page_url": expected["source_page_url"],
                  "source_asset_key": source_asset_key({
                      "provider": candidate.get("provider"),
                      "source_page_url": expected["source_page_url"],
                      "provider_asset_id": candidate_id.rsplit("-", 1)[-1],
                  }),
                  "sha256": actual_sha,
                  "perceptual_hash": phash,
              }
              for field, seen_field in (
                  ("sha256", "sha256"),
                  ("perceptual_hash", "perceptual_hash"),
                  ("source_asset_key", "source_asset_key"),
              ):
                  value = identity[field].lower()
                  if value in seen[seen_field]:
                      blockers.append({"type": "candidate_collision", "field": field, "value": value})
                  seen[seen_field].add(value)
              if actual_sha in registry_sha:
                  blockers.append({"type": "global_sha256_collision", "candidate_id": candidate_id, "value": actual_sha})
              if phash in registry_phash:
                  blockers.append({"type": "global_perceptual_collision", "candidate_id": candidate_id, "value": phash})
              if identity["source_asset_key"] in registry_sources:
                  blockers.append({
                      "type": "global_source_collision",
                      "candidate_id": candidate_id,
                      "value": identity["source_asset_key"],
                  })
              reports.append({
                  "candidate_id": candidate_id,
                  "source_page_url": expected["source_page_url"],
                  "media_url": expected["media_url"],
                  "sha256": actual_sha,
                  "perceptual_hash": phash,
                  "fingerprint_algorithm": FINGERPRINT_ALGORITHM,
                  "metadata": {
                      "duration_seconds": round(duration, 3),
                      "width": metadata["width"],
                      "height": metadata["height"],
                      "fps": metadata["fps"],
                      "codec": metadata["codec"],
                      "size_bytes": metadata["size"],
                  },
                  "global_source_collision": identity["source_asset_key"] in registry_sources,
                  "global_sha256_collision": actual_sha in registry_sha,
                  "global_perceptual_collision": phash in registry_phash,
                  "human_approval": "PENDING",
                  "approved_for_render": False,
                  "global_catalog_updated": False,
              })

          report = {
              "status": "FINGERPRINT_AUDIT_PASS" if not blockers else "FINGERPRINT_AUDIT_BLOCKED",
              "episode_id": "episode-005",
              "requested_candidate_ids": requested_ids,
              "registry_schema_version": registry_schema,
              "fingerprint_algorithm": FINGERPRINT_ALGORITHM,
              "candidate_count": len(reports),
              "candidates": reports,
              "blockers": blockers,
              "human_approval_pending": True,
              "promotion_allowed": False,
              "global_catalog_updated": False,
              "render_allowed": False,
              "drive_written": False,
          }
          (root / "fingerprint-audit.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2))
          if blockers:
              raise SystemExit(1)
          PY

      - name: Upload fingerprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: episode005-visual-fingerprint-audit
          path: artifacts/episode005-visual-fingerprint
          if-no-files-found: error
