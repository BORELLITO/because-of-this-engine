name: Because Of This V7.4 V1.1 hardening checks (no media)
on:
  pull_request:
    branches: [v7.4-editorial-story-engine]
    paths:
      - "production/quality_gates.py"
      - "audits/**"
      - ".github/workflows/audit-v11-v74-ci.yml"
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout candidate code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile modified production module
        run: python -m py_compile production/quality_gates.py
      - name: Run isolated V1.1 contract regressions (no APIs)
        run: python -m unittest discover -s audits/tests -p 'test_*.py' -v
      - name: Inspect effective engine fingerprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from production.canonical_config import CANONICAL_PROFILE_FINGERPRINT, CANONICAL_PROFILE_ID
          policy=json.loads(Path("production/active_engine_policy.json").read_text())
          print("EFFECTIVE_FINGERPRINT=" + CANONICAL_PROFILE_FINGERPRINT)
          print("DECLARED_FINGERPRINT=" + policy["active_engine_fingerprint"])
          print("ACTIVE_PROFILE=" + CANONICAL_PROFILE_ID)
          PY
      - name: Run existing current-engine policy and editorial tests
        run: |
          python -m unittest tests/test_current_engine_policy.py tests/test_editorial_story_gates.py tests/test_reuse_first.py -v
      - name: Declare no-media scope
        run: echo "Offline only. No TTS, no media, no Drive writes, no publishing."
