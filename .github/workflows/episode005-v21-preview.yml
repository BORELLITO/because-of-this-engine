name: Because Of This V2.1 Episode 005 Creative Preview

# Isolated creative preview renderer. It never enables production, writes Drive,
# mutates the global visual catalog or publishes. The preview is fail-closed on
# the approved direct Gemini TTS Charon identity: Edge and Creative Claw substitutions are not accepted on this route.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run containing the approved Charon narration artifact"
        required: true
        default: ""
        type: string
      source_artifact_name:
        description: "Artifact containing narration.wav, narration.ass and voice-profile.json"
        required: true
        default: "episode005-charon-narration"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  render-v21-creative-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install bounded static FFmpeg
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/ffmpeg-static"
          archive="${tools_dir}/ffmpeg.tar.xz"
          mkdir -p "${tools_dir}"
          curl --fail --location --retry 2 --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
            --output "${archive}"
          tar -xJf "${archive}" -C "${tools_dir}"
          ffmpeg_path="$(find "${tools_dir}" -type f -name ffmpeg -perm -111 | head -n 1)"
          ffprobe_path="$(find "${tools_dir}" -type f -name ffprobe -perm -111 | head -n 1)"
          test -n "${ffmpeg_path}" && test -n "${ffprobe_path}"
          echo "$(dirname "${ffmpeg_path}")" >> "${GITHUB_PATH}"

      - name: Verify media tools
        run: |
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download approved Charon narration artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: artifacts/episode005-charon

      - name: Verify locked narration identity and audio
        run: |
          python - <<'PY'
          import hashlib
          import json
          import wave
          from pathlib import Path

          root = Path("artifacts/episode005-charon")
          audio = root / "narration.wav"
          profile_path = root / "voice-profile.json"
          captions = root / "narration.ass"
          assert audio.is_file(), audio
          assert profile_path.is_file(), profile_path
          assert captions.is_file(), captions
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          assert profile["provider"] == "gemini_tts", profile
          assert profile["voice_name"] == "Charon", profile
          assert profile["model"] == "gemini-3.8-flash-tts", profile
          assert profile["identity_status"] == "APPROVED_REFERENCE_MATCH", profile
          digest = hashlib.sha256(audio.read_bytes()).hexdigest()
          assert digest == profile["audio_sha256"], {"expected": profile["audio_sha256"], "actual": digest}
          with wave.open(str(audio), "rb") as stream:
              duration = stream.getnframes() / stream.getframerate()
              assert stream.getnchannels() == 1
              assert stream.getsampwidth() == 2
              assert stream.getframerate() in {24000, 48000}
              assert 60 <= duration <= 80, duration
          print({"voice": profile["voice_name"], "provider": profile["provider"], "duration_seconds": round(duration, 3), "audio_sha256": digest})
          PY

      - name: Download and hash approved preview visuals
        run: |
          PYTHONPATH=. python production/fetch_v21_visuals.py \
            --manifest episodes/episode-005/visual/scene-asset-manifest.json \
            --output-root artifacts/episode005-visuals

      - name: Build deterministic suspense bed
        run: |
          mkdir -p artifacts/episode005-audio
          python production/generate_suspense_bed.py \
            --output artifacts/episode005-audio/suspense-bed.wav \
            --duration 85 \
            --sample-rate 48000

      - name: Render isolated V2.1 creative preview
        run: |
          mkdir -p artifacts/episode005-v21-preview
          PYTHONPATH=. python production/render_v21_preview.py \
            --scene-manifest episodes/episode-005/visual/scene-asset-manifest.json \
            --story-architecture episodes/episode-005/story-architecture.json \
            --asset-root artifacts/episode005-visuals \
            --audio artifacts/episode005-charon/narration.wav \
            --captions artifacts/episode005-charon/narration.ass \
            --music artifacts/episode005-audio/suspense-bed.wav \
            --logo brand/because-of-this-logo.png \
            --voice-profile artifacts/episode005-charon/voice-profile.json \
            --output artifacts/episode005-v21-preview/episode005-v21-preview.mp4 \
            --report artifacts/episode005-v21-preview/preview-report.json

      - name: Validate creative preview report and media
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path("artifacts/episode005-v21-preview")
          report = json.loads((root / "preview-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "V21_CREATIVE_PREVIEW_RENDER_PASS", report
          assert report["creative_profile"] == "cinematic_dread_v73", report
          assert report["voice"]["voice_name"] == "Charon", report
          assert report["music"]["status"] == "DETERMINISTIC_SUSPENSE_BED_MIXED", report
          assert report["branding"]["logo_overlay"] is True, report
          assert report["production_enablement"] is False, report
          output = root / "episode005-v21-preview.mp4"
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height,r_frame_rate,sample_rate,channels:format=duration", "-of", "json", str(output)],
              check=True, capture_output=True, text=True,
          )
          data = json.loads(probe.stdout)
          video = next(item for item in data["streams"] if item["codec_type"] == "video")
          audio = next(item for item in data["streams"] if item["codec_type"] == "audio")
          assert (int(video["width"]), int(video["height"])) == (1080, 1920)
          assert video["r_frame_rate"] == "60/1"
          assert audio["sample_rate"] == "48000"
          print({"status": report["status"], "duration": data["format"]["duration"], "voice": report["voice"], "audio_sample_rate": audio["sample_rate"]})
          PY

      - name: Upload isolated V2.1 creative preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode005-v21-creative-preview
          path: |
            artifacts/episode005-v21-preview
            artifacts/episode005-audio/suspense-bed.wav
            artifacts/episode005-visuals/download-report.json
          if-no-files-found: error
