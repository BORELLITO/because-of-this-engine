name: Because Of This reuse-first CI

on:
  push:
    branches:
      - v7.3.4-reuse-first-performance
    paths:
      - "production/reuse_first.py"
      - "production/google_drive_assets.py"
      - "production/render_video_episode.py"
      - "production/google_drive_delivery.py"
      - "production/narration_cache.py"
      - "production/v7_orchestrator.py"
      - "production/quality_gates.py"
      - "production/canonical_config.py"
      - "production/v7_contract.py"
      - "production/gemini_tts.py"
      - "production/production_record_v7.py"
      - "production/video_asset_contract.py"
      - "production/v7_singleton_guard.py"
      - "production/v7_post_publication.py"
      - "production/active_engine_policy.json"
      - "tests/**"
      - ".github/workflows/episode-002-draft-preview.yml"
      - ".github/workflows/reuse-first-ci.yml"
  pull_request:
    paths:
      - "production/reuse_first.py"
      - "production/google_drive_assets.py"
      - "production/render_video_episode.py"
      - "production/google_drive_delivery.py"
      - "production/v7_orchestrator.py"
      - "production/quality_gates.py"
      - "production/canonical_config.py"
      - "production/v7_contract.py"
      - "production/gemini_tts.py"
      - "production/production_record_v7.py"
      - "production/video_asset_contract.py"
      - "production/v7_singleton_guard.py"
      - "production/v7_post_publication.py"
      - "production/active_engine_policy.json"
      - "tests/**"
      - ".github/workflows/episode-002-draft-preview.yml"
      - ".github/workflows/reuse-first-ci.yml"

permissions:
  contents: read

jobs:
  static-and-reuse-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile changed production modules
        run: |
          python -m py_compile \
            production/reuse_first.py \
            production/google_drive_assets.py \
            production/render_video_episode.py \
            production/google_drive_delivery.py \
            production/narration_cache.py \
            production/v7_orchestrator.py \
            production/quality_gates.py \
            production/canonical_config.py \
            production/v7_contract.py \
            production/gemini_tts.py \
            production/production_record_v7.py \
            production/video_asset_contract.py \
            production/v7_singleton_guard.py \
            production/v7_post_publication.py

      - name: Verify canonical engine singleton
        run: PYTHONPATH=. python production/v7_singleton_guard.py --repo-root .

      - name: Run reuse-first unit tests
        run: python -m unittest tests.test_reuse_first tests.test_current_engine_policy -v
