name: Cinematic Dread V7.3 integration CI — no paid media

on:
  push:
    branches:
      - feature/v73-cinematic-dread-atmosphere
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinematic-dread-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atmosphere:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Compile active production and verify Charon singleton
        run: |
          python -m py_compile production/*.py
          PYTHONPATH=. python production/v7_singleton_guard.py --repo-root .
      - name: Test scene moods, color grading, audio automation, QA and real FFmpeg filters
        run: |
          PYTHONPATH=. python -m unittest -v \
            tests.test_cinematic_dread_v73 \
            tests.test_cinematic_dread_render_v73 \
            tests.test_dread_soundscape_v73 \
            tests.test_dread_ffmpeg_smoke
      - name: Verify source Charon contract remains exactly unchanged
        run: |
          PYTHONPATH=. python production/v7_contract.py --repo-root . \
            --manifest episodes/video-001/manifest.json --require-production
          PYTHONPATH=. python production/canonical_config.py --manifest episodes/video-001/manifest.json
      - name: Verify opt-out produces original unmodified edit plan
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from production.cinematic_dread import plan
          for name in ("manifest.json", "preview-manifest.json"):
              p=Path("episodes/video-001")/name
              m=json.loads(p.read_text(encoding="utf-8"))
              assert plan(m)["enabled"] is False, "Do not mutate approved releases before human preview"
          print("V73_CINEMATIC_DREAD_OPT_IN_HARD_LOCK_PASS")
          PY
      - name: Confirm no paid external services, publishing or media rerender
        run: |
          echo "STATIC_AND_SYNTHETIC_FFMPEG_SMOKE_ONLY"
          echo "NO_GEMINI_TTS_CALL_NO_DRIVE_WRITE_NO_EPISODE_REBUILD"
