name: Because Of This — non-destructive storage audit

# Production evidence is never removed by scheduled housekeeping.
# Only inventory/report. Deletion requires a separate reviewed change.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 0"

permissions:
  actions: read
  contents: read

concurrency:
  group: because-of-this-storage-audit
  cancel-in-progress: false

jobs:
  storage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inventory artifacts, runs and caches (READ ONLY)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner, repo, per_page: 100});
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {owner, repo, per_page: 100});
            const bytes = artifacts.reduce((sum, item) => sum + (item.size_in_bytes || 0), 0);
            const expired = artifacts.filter(item => item.expired).length;
            const now = Date.now();
            const soon = artifacts.filter(item => item.expires_at &&
              new Date(item.expires_at).getTime() > now &&
              new Date(item.expires_at).getTime() - now <= 7 * 86400000);
            const names = soon.slice(0, 20).map(item =>
              `- ${item.name}: expires ${item.expires_at}, artifact #${item.id}`);
            await core.summary
              .addHeading('Because Of This — READ-ONLY storage audit')
              .addRaw(`Artifacts: ${artifacts.length}; approx bytes: ${bytes}; expired: ${expired}\n\n`)
              .addRaw(`Workflow runs indexed: ${runs.length}\n\n`)
              .addHeading('Artifacts expiring within 7 days')
              .addRaw(names.length ? names.join('\n') + '\n' : 'None detected.\n')
              .addRaw('\nNo artifact, run, cache, branch or release was deleted.\n')
              .write();
