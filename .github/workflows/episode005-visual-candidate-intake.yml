name: Because Of This Episode 005 Visual Candidate Intake

# Pull-request and manual intake are fail-closed: this workflow creates an auditable candidate artifact.
# It never promotes an asset to the render manifest, never mutates the global catalog,
# and never writes to Drive or publishes media.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/episode005-visual-candidate-intake.yml"
      - "episodes/episode-005/visual/asset-acquisition-plan.json"
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Candidate identifier from asset-acquisition-plan.json"
        required: true
        default: "mixkit-clock-mechanism-3651"
        type: string
      source_page_url:
        description: "Verified provider page URL"
        required: true
        default: "https://mixkit.co/free-stock-video/mechanism-of-a-working-clock-3651/"
        type: string
      media_url:
        description: "Direct media URL observed on the verified provider page"
        required: true
        default: "https://assets.mixkit.co/videos/3651/3651-720.mp4"
        type: string
      license_name:
        description: "License visibly stated on the provider page"
        required: true
        default: "Mixkit Stock Video Free License"
        type: string

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify media tools
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download candidate without promotion
        env:
          MEDIA_URL: ${{ github.event.inputs.media_url || 'https://assets.mixkit.co/videos/3651/3651-720.mp4' }}
        run: |
          mkdir -p artifacts/episode005-visual-intake
          curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 180 "$MEDIA_URL"             --output artifacts/episode005-visual-intake/candidate.mp4
          test -s artifacts/episode005-visual-intake/candidate.mp4

      - name: Validate video and create intake evidence
        env:
          CANDIDATE_ID: ${{ github.event.inputs.candidate_id || 'mixkit-clock-mechanism-3651' }}
          SOURCE_PAGE_URL: ${{ github.event.inputs.source_page_url || 'https://mixkit.co/free-stock-video/mechanism-of-a-working-clock-3651/' }}
          MEDIA_URL: ${{ github.event.inputs.media_url || 'https://assets.mixkit.co/videos/2965/2965-720.mp4' }}
          LICENSE_NAME: ${{ github.event.inputs.license_name || 'Mixkit Stock Video Free License' }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path("artifacts/episode005-visual-intake")
          media = root / "candidate.mp4"
          allowed = {
              "mixkit-slowly-approaching-clock-28897": {
                  "source_page_url": "https://mixkit.co/free-stock-video/slowly-approaching-a-clock-on-a-black-background-28897/",
                  "media_url": "https://assets.mixkit.co/videos/28897/28897-720.mp4",
              },
              "mixkit-cloudy-sky-118": {
                  "source_page_url": "https://mixkit.co/free-stock-video/cloudy-sky-118/",
                  "media_url": "https://assets.mixkit.co/videos/118/118-720.mp4",
              },
              "mixkit-large-satellite-antenna-2650": {
                  "source_page_url": "https://mixkit.co/free-stock-video/large-satellite-antenna-in-the-forest-2650/",
                  "media_url": "https://assets.mixkit.co/videos/2650/2650-720.mp4",
              },
              "mixkit-clock-mechanism-3651": {
                  "source_page_url": "https://mixkit.co/free-stock-video/mechanism-of-a-working-clock-3651/",
                  "media_url": "https://assets.mixkit.co/videos/3651/3651-720.mp4",
              },

              "mixkit-abstract-red-glow-101432": {
                  "source_page_url": "https://mixkit.co/free-stock-video/abstract-red-glow-101432/",
                  "media_url": "https://assets.mixkit.co/bohe8920pfehyvq7p1hk5r699s7g",
              },
          }
          candidate_id = os.environ["CANDIDATE_ID"]
          assert candidate_id in allowed, candidate_id
          assert os.environ["SOURCE_PAGE_URL"] == allowed[candidate_id]["source_page_url"]
          assert os.environ["MEDIA_URL"] == allowed[candidate_id]["media_url"]
          probe = subprocess.run(
              [
                  "ffprobe", "-v", "error", "-show_entries",
                  "format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate",
                  "-of", "json", str(media)
              ],
              check=True, capture_output=True, text=True
          )
          data = json.loads(probe.stdout)
          streams = [s for s in data.get("streams", []) if s.get("codec_type") == "video"]
          assert len(streams) == 1, data
          video = streams[0]
          duration = float(data["format"]["duration"])
          width = int(video["width"])
          height = int(video["height"])
          assert duration > 0, duration
          assert width >= 720 and height >= 720, (width, height)
          sha256 = hashlib.sha256(media.read_bytes()).hexdigest()
          report = {
              "status": "CANDIDATE_DOWNLOADED_AWAITING_HUMAN_QA",
              "candidate_id": candidate_id,
              "provider": "mixkit",
              "source_page_url": os.environ["SOURCE_PAGE_URL"],
              "media_url": os.environ["MEDIA_URL"],
              "license_name": os.environ["LICENSE_NAME"],
              "sha256": sha256,
              "metadata": {
                  "duration_seconds": round(duration, 3),
                  "width": width,
                  "height": height,
                  "frame_rate": video.get("r_frame_rate"),
                  "codec": video.get("codec_name"),
              },
              "promotion": {
                  "approved_for_render": False,
                  "global_catalog_updated": False,
                  "thumbnail_eligible": False,
                  "drive_written": False,
              },
              "qa_required": [
                  "clean-frame visual inspection",
                  "no baked captions or authored graphics",
                  "no embedded logo or letterbox",
                  "semantic fit against assigned story beats",
                  "global reuse fingerprint check",
                  "human approval"
              ],
          }
          (root / "candidate-intake.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Generate human-QA frames
        run: |
          ffmpeg -v error -y -i artifacts/episode005-visual-intake/candidate.mp4             -vf "fps=1,scale=540:-2,tile=3x1:padding=8:margin=8:color=black"             -frames:v 1 -q:v 2 artifacts/episode005-visual-intake/qa-frames.jpg

      - name: Generate locked 9x16 crop preview
        run: |
          ffmpeg -v error -y -i artifacts/episode005-visual-intake/candidate.mp4             -vf "crop=ih*9/16:ih:(iw-ih*9/16)/2:0,scale=540:960"             -frames:v 1 -q:v 2 artifacts/episode005-visual-intake/qa-crop-9x16.jpg

      - name: Upload isolated candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: episode005-visual-intake-${{ github.event.inputs.candidate_id || 'mixkit-clock-mechanism-3651' }}
          path: artifacts/episode005-visual-intake
          if-no-files-found: error
