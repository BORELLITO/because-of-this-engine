name: Because Of This V7.3 Charon suspense-cinema final production

on:
  push:
    branches:
      - v7.3-charon-suspense-cinema-final
  workflow_dispatch:
    inputs:
      manifest:
        description: "Final manifest: episodes/<episode>/manifest.json"
        required: true
        default: "episodes/video-001/manifest.json"
        type: string

permissions:
  contents: read

concurrency:
  group: because-of-this-v7.3-charon-suspense-cinema-media-global
  cancel-in-progress: false

env:
  BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"
  PYTHONUNBUFFERED: "1"

jobs:
  final-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected preview branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate final manifest scope
        env:
          MANIFEST: ${{ inputs.manifest || 'episodes/video-001/manifest.json' }}
        run: |
          set -euo pipefail
          test "${MANIFEST}" = "episodes/video-001/manifest.json"
          test -f "${MANIFEST}"
          python - "${MANIFEST}" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value.get("lifecycle_status") != "FINAL_APPROVED":
              raise SystemExit("final manifest must remain DRAFT_PREVIEW_ONLY")
          if value.get("human_approval_required") is not True:
              raise SystemExit("final manifest must retain human approval requirement")
          print("FINAL_MANIFEST_SCOPE_PASS")
          PY

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Validate canonical V7.2 Charon contract
        run: |
          PYTHONPATH=. python production/v7_contract.py \
            --repo-root . --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" --require-production


      - name: Gemini TTS Charon preflight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ffmpeg
          PYTHONPATH=. python production/gemini_tts.py --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" --preflight

      - name: Restore identical existing Charon narration from Drive cache
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/narration_cache.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" --restore \
            --status-file "${RUNNER_TEMP}/v72-cache-result.json"
          python - "${RUNNER_TEMP}/v72-cache-result.json" <<'PY'
          import json, os, sys
          status=json.load(open(sys.argv[1], encoding="utf-8"))["status"]
          if status not in {"NARRATION_CACHE_HIT","NARRATION_CACHE_MISS"}:
              raise SystemExit("Unexpected Charon cache status")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("CHARON_CACHE_HIT=" + ("true" if status=="NARRATION_CACHE_HIT" else "false") + "\n")
          print("CHARON_CACHE_REUSE_STATUS=" + status)
          PY

      - name: Generate only missing Charon narration
        if: env.CHARON_CACHE_HIT != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/gemini_tts.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" \
            --input "episodes/video-001/script.txt" \
            --output-dir "episodes/video-001/audio"

      - name: Store newly generated Charon narration in verified Drive cache
        if: env.CHARON_CACHE_HIT != 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          PYTHONPATH=. python production/narration_cache.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" --store
      - name: Install independent Vosk alignment models
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/vosk" "${RUNNER_TEMP}/vosk-secondary"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://alphacephei.com/vosk/models/vosk-model-en-us-0.22-lgraph.zip" \
            --output "${RUNNER_TEMP}/vosk/model.zip"
          unzip -q "${RUNNER_TEMP}/vosk/model.zip" -d "${RUNNER_TEMP}/vosk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            --output "${RUNNER_TEMP}/vosk-secondary/model.zip"
          unzip -q "${RUNNER_TEMP}/vosk-secondary/model.zip" -d "${RUNNER_TEMP}/vosk-secondary"
          echo "VOSK_MODEL_DIR=${RUNNER_TEMP}/vosk/vosk-model-en-us-0.22-lgraph" >> "${GITHUB_ENV}"
          echo "VOSK_SECONDARY_MODEL_DIR=${RUNNER_TEMP}/vosk-secondary/vosk-model-small-en-us-0.15" >> "${GITHUB_ENV}"

      - name: Build forced-alignment captions and story coverage
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/align_captions.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" \
            --model-dir "${VOSK_MODEL_DIR}" \
            --secondary-model-dir "${VOSK_SECONDARY_MODEL_DIR}"
          PYTHONPATH=. python production/story_intelligence.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" \
            --alignment "episodes/video-001/captions/narration.alignment.json" \
            --report "episodes/video-001/rendered/narration-coverage.json"

      - name: Generate deterministic suspense soundtrack
        run: |
          set -euo pipefail
          mkdir -p episodes/video-001/audio
          PYTHONPATH=. python production/generate_suspense_bed.py \
            --output episodes/video-001/audio/music.wav \
            --duration 70 \
            --sample-rate 48000

      - name: Hydrate approved Drive assets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/google_drive_assets.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" --require-drive-assets

      - name: Run visual-story QA in final mode
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/visual_story_qa.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" \
            --mode final \
            --report "episodes/video-001/rendered/visual-story-qa-final.json"

      - name: Render complete final production
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/render_video_episode.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" --mode final

      - name: Validate media and locked layout
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/caption_quality.py \
            --require-word-level \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" \
            --report "episodes/video-001/rendered/caption-quality-final.json"
          PYTHONPATH=. python production/validate_video_release.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" --mode final \
            --report "episodes/video-001/rendered/video-release-final.json"
          PYTHONPATH=. python production/golden_frame_regression.py \
            --manifest "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" --mode final \
            --report "episodes/video-001/rendered/golden-layout-final.json"

      - name: Register preview artifacts and evaluate V7 gates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANIFEST: ${{ inputs.manifest || 'episodes/video-001/manifest.json' }}
        run: |
          set -euo pipefail
          python - "${MANIFEST}" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          path = Path(sys.argv[1]).resolve()
          value = json.loads(path.read_text(encoding="utf-8"))
          root = path.parent.resolve()
          runtime = {
              "narration_coverage": "rendered/narration-coverage.json",
              "final_audio": "audio/narration.wav",
              "captions": "captions/narration.ass",
              "alignment": "captions/narration.alignment.json",
              "preview": f"rendered/{value['video_id']}-final.mp4",
              "render": f"rendered/{value['video_id']}-final.mp4",
              "technical_qa": "rendered/video-release-final.json",
              "music": "audio/music.wav",
              "preview_approval": "rendered/preview-approval.json",
          }
          hashes = {}
          for key, relative in runtime.items():
              candidate = (root / relative).resolve()
              if root not in candidate.parents or not candidate.is_file():
                  raise SystemExit(f"missing or escaping artifact: {relative}")
              hashes[key] = hashlib.sha256(candidate.read_bytes()).hexdigest()
          value["runtime_artifacts"] = runtime
          value["runtime_artifact_hashes"] = hashes
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          PYTHONPATH=. python production/v7_orchestrator.py \
            --repo-root . --manifest "${MANIFEST}" --mode production \
            --check-gemini-tts \
            --report "episodes/video-001/rendered/v7-release-final.json"

      - name: Deliver verified preview bundle to Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/google_drive_delivery.py \
            --collection "FINAL V7" \
            --delivery-name "episode-001-final-${{ github.run_id }}" \
            --job-id "final-${{ github.run_id }}" \
            --path "episodes/video-001/rendered" \
            --path "episodes/video-001/audio/narration.wav" \
            --path "episodes/video-001/audio/music.wav" \
            --path "episodes/video-001/captions" \
            --path "${{ inputs.manifest || 'episodes/video-001/manifest.json' }}" \
            --receipt "${RUNNER_TEMP}/final-drive-delivery.json"

      - name: Print approval handoff
        run: |
          echo "FINAL_PRODUCTION_COMPLETE"
          echo "Final production gates passed; publication remains manual."
