name: Because Of This Edge TTS Episode 005 Preview

# Real Edge synthesis is manual-only: every run can produce a new acoustic file.
# This prevents PR metadata changes from silently replacing the approved audio.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-tts-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Edge TTS
        run: python -m pip install --disable-pip-version-check --no-cache-dir edge-tts==7.3.1 imageio-ffmpeg==0.8.1

      - name: Verify portable FFmpeg
        run: |
          python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_version())
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY

      - name: Run voice preflight
        run: |
          PYTHONPATH=. python production/microsoft_edge_tts.py \
            --manifest episodes/episode-005/story-architecture.json \
            --preflight

      - name: Generate one Episode 005 narration preview
        run: |
          mkdir -p artifacts/episode005-edge
          PYTHONPATH=. python production/microsoft_edge_tts.py \
            --manifest episodes/episode-005/story-architecture.json \
            --input episodes/episode-005/narration/en-US-charon-v1.txt \
            --output-dir artifacts/episode005-edge

      - name: Validate generated WAV
        run: |
          python - <<'PY'
          import json
          import wave
          from pathlib import Path
          root = Path("artifacts/episode005-edge")
          audio = root / "narration.wav"
          report = root / "edge-tts-report.json"
          assert audio.is_file(), audio
          assert report.is_file(), report
          with wave.open(str(audio), "rb") as stream:
              duration = stream.getnframes() / stream.getframerate()
              assert stream.getnchannels() == 1
              assert stream.getsampwidth() == 2
              assert 60 <= duration <= 80, duration
          data = json.loads(report.read_text())
          assert data["provider"] == "microsoft_edge_tts"
          assert data["profile"]["voice_name"] == "en-US-ChristopherNeural"
          print({"duration_seconds": round(duration, 3), "voice": data["profile"]["voice_name"]})
          PY

      - name: Build caption manifest for validated audio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = {
              "audio": {"path": "narration.wav"},
              "script": {"path": "../../episodes/episode-005/narration/en-US-charon-v1.txt"},
              "captions": {
                  "path": "narration.ass",
                  "alignment_sidecar": "narration.alignment.json",
                  "max_line_chars": 42,
                  "active_word_color": "#FF7777"
              }
          }
          Path("artifacts/episode005-edge/caption-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate native Edge word-timed captions
        run: |
          PYTHONPATH=. python production/align_edge_captions.py \
            --manifest artifacts/episode005-edge/caption-manifest.json \
            --word-boundaries artifacts/episode005-edge/edge-word-boundaries.json

      - name: Validate forced-alignment captions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/episode005-edge")
          ass = root / "narration.ass"
          sidecar = root / "narration.alignment.json"
          assert ass.is_file() and ass.stat().st_size > 0, ass
          data = json.loads(sidecar.read_text(encoding="utf-8"))
          assert data["status"] == "EDGE_TTS_NATIVE_ALIGNMENT_PASS"
          assert data["word_count"] > 0
          assert data["word_timing_normalization"]["timeline_monotonic"] is True
          print({
              "caption_status": data["status"],
              "timing_mode": data["timing_mode"],
              "grouped_provider_boundaries_preserved": data["word_timing_normalization"].get("grouped_provider_boundaries_preserved", False),
              "word_count": data["word_count"],
              "caption_file": str(ass),
          })
          PY

      - name: Upload isolated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode005-edge-tts-preview
          path: artifacts/episode005-edge
          if-no-files-found: error