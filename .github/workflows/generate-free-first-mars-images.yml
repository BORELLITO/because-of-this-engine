name: Generate free-first Mars visuals

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene to generate"
        required: true
        default: "S01"
        type: choice
        options:
          - S01
          - S02
          - S03
          - S04
          - S05
          - S06
          - ALL
      allow_generative_fallback:
        description: "Use Cloudflare AI only if the factual NASA provider fails"
        required: true
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate factual-first assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_MODEL: "@cf/stabilityai/stable-diffusion-xl-base-1.0"
        run: |
          EXTRA=""
          if [ "${{ inputs.allow_generative_fallback }}" = "true" ]; then
            EXTRA="--allow-generative-fallback"
          fi
          python production/generate_free_first_mars_images.py \
            --scene "${{ inputs.scene }}" \
            --max-requests 6 \
            $EXTRA
      - name: Upload assets for review
        uses: actions/upload-artifact@v4
        with:
          name: mars-free-first-assets-${{ inputs.scene }}
          path: production/mars-assets/
          if-no-files-found: error
          retention-days: 7
