name: Generate free-first Mars visuals

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene to generate"
        required: true
        default: "S01"
        type: choice
        options:
          - S01
          - S02
          - S03
          - S04
          - S05
          - S06
          - ALL
      allow_generative_fallback:
        description: "Use Cloudflare AI only if the factual NASA provider fails"
        required: true
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Google Drive destination
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1GUOcSRo91xxypW-GgCchubhx9FaMGk5u"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python production/google_drive_delivery.py --preflight
      - name: Generate factual-first assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_MODEL: "@cf/stabilityai/stable-diffusion-xl-base-1.0"
        run: |
          EXTRA=""
          if [ "${{ inputs.allow_generative_fallback }}" = "true" ]; then
            EXTRA="--allow-generative-fallback"
          fi
          python production/generate_free_first_mars_images.py \
            --scene "${{ inputs.scene }}" \
            --max-requests 6 \
            $EXTRA

      - name: Deliver generated assets to Google Drive
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1GUOcSRo91xxypW-GgCchubhx9FaMGk5u"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python production/google_drive_delivery.py \
            --collection "ASSETS" \
            --delivery-name "mars-free-first-${{ inputs.scene }}-${{ github.run_id }}" \
            --path production/mars-assets
