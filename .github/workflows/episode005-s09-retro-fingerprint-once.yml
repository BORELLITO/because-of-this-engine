name: Ep005 S09 retro real fingerprint isolated one-shot

on:
  push:
    branches: ["audit/v21-s09-retro-approval-20261107"]
    paths: [".github/workflows/episode005-s09-retro-fingerprint-once.yml"]

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install media decoding tools if missing
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Fetch exact source and audit global known history
        run: |
          set -euo pipefail
          mkdir -p artifacts/episode005-s09-fingerprint
          curl --fail --location --retry 2 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 --max-filesize 150M \
            'https://videos.pexels.com/video-files/8888977/8888977-uhd_4096_2160_25fps.mp4' \
            --output artifacts/episode005-s09-fingerprint/candidate.mp4
          PYTHONPATH=. python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from production.asset_reuse_brain import source_asset_key, canonicalize_source_url
          from production.video_asset_contract import sha256_file,ffprobe,perceptual_hash,FINGERPRINT_ALGORITHM
          source=Path('artifacts/episode005-s09-fingerprint/candidate.mp4')
          expected_sha='b5e41fafc252a88d3959fbb3df0294010397e6687d833d884bc5a0bfdd48fa51'
          sha=sha256_file(source)
          assert sha==expected_sha, {'expected_sha':expected_sha,'actual_sha':sha}
          info=ffprobe(source)
          ph=perceptual_hash(source,duration=float(info['duration']))
          page='https://www.pexels.com/video/person-typing-on-a-keyboard-8888977/'
          source_key=source_asset_key({'provider':'pexels','source_page_url':page})
          needle={'sha256':sha.lower(),'perceptual_hash':ph.lower(),'source_asset_key':source_key.lower(),'canonical_source_url':canonicalize_source_url(page).lower(),'provider_asset_id':'8888977'}
          registry=json.loads(Path('episodes/asset-memory-registry.json').read_text())
          assert registry.get('schema_version') in (1,2),'unknown registry schema'
          assert isinstance(registry.get('assets'),list),'invalid registry'
          collision=[]
          checked=0
          for row in registry['assets']:
            checked+=1
            identities={
                'sha256':str(row.get('sha256') or '').lower(),
                'perceptual_hash':str(row.get('perceptual_hash') or '').lower(),
                'source_asset_key':str(row.get('source_asset_key') or '').lower(),
                'canonical_source_url':canonicalize_source_url(row.get('canonical_source_url') or row.get('source_page_url')).lower(),
                'provider_asset_id':str(row.get('provider_asset_id') or '').lower(),
            }
            for k,v in needle.items():
              if identities[k] and identities[k]==v:
                collision.append({'source':'registry','record_id':row.get('asset_id'),'field':k,'value':v})
          manifest_paths=sorted(Path('episodes').glob('*/manifest.json'))
          historical_scenes=0
          for manifest_path in manifest_paths:
            data=json.loads(manifest_path.read_text())
            for scene in data.get('scenes',[]):
              asset=scene.get('asset') or {}
              if not isinstance(asset,dict):continue
              historical_scenes+=1
              identities={
                'sha256':str(asset.get('sha256') or '').lower(),
                'perceptual_hash':str(asset.get('perceptual_hash') or '').lower(),
                'source_asset_key':str(source_asset_key(asset) or '').lower(),
                'canonical_source_url':canonicalize_source_url(asset.get('source_page_url')).lower(),
                'provider_asset_id':str(asset.get('provider_asset_id') or '').lower(),
              }
              for k,v in needle.items():
                if identities[k] and identities[k]==v:
                  collision.append({'source':str(manifest_path),'record_id':asset.get('asset_id'),'field':k,'value':v})
          for plan_path in sorted(Path('episodes').glob('*/visual/asset-acquisition-plan.json')):
            plan=json.loads(plan_path.read_text())
            for candidate in plan.get('candidates',[]):
              if not isinstance(candidate,dict):continue
              identity={
                'sha256':str((candidate.get('intake_artifact') or {}).get('sha256') or '').lower(),
                'perceptual_hash':str((candidate.get('intake_artifact') or {}).get('perceptual_hash') or '').lower(),
                'source_asset_key':str(source_asset_key(candidate) or '').lower(),
                'canonical_source_url':canonicalize_source_url(candidate.get('source_page_url')).lower(),
                'provider_asset_id':str(candidate.get('provider_asset_id') or '').lower(),
              }
              for k,v in needle.items():
                if identity[k] and identity[k]==v:
                  collision.append({'source':str(plan_path),'record_id':candidate.get('candidate_id'),'field':k,'value':v})
          report={
            'episode_id':'episode-005',
            'candidate_id':'pexels-8888977',
            'status':'KNOWN_HISTORY_FINGERPRINT_PASS' if not collision else 'BLOCKED_KNOWN_IDENTITY_COLLISION',
            'registry_asset_records_checked':checked,
            'historical_episode_scene_records_checked':historical_scenes,
            'historical_manifest_count':len(manifest_paths),
            'fingerprint_algorithm':FINGERPRINT_ALGORITHM,
            'sha256':sha,'perceptual_hash':ph,'source_asset_key':source_key,
            'metadata':info,'collisions':collision,
            'coverage_limit':'Known GitHub manifests and checked-in registry only; absent external or unindexed releases remain unknown',
            'render_approved':False,'manifest_promoted':False,
            'voice_or_publication_changed':False
          }
          dest=Path('artifacts/episode005-s09-fingerprint/fingerprint-report.json')
          dest.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          assert not collision,report
          PY
      - name: Archive fingerprint evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode005-s09-retro-fingerprint-${{ github.run_id }}
          path: artifacts/episode005-s09-fingerprint/fingerprint-report.json
          retention-days: 7
          if-no-files-found: error
