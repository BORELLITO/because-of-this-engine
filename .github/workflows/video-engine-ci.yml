name: Because Of This V7.3 Charon engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: because-of-this-v7-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Compile the active V7.3 production surface
        run: python -m py_compile production/*.py
      - name: Enforce one active Charon engine
        run: PYTHONPATH=. python production/v7_singleton_guard.py --repo-root .
      - name: Validate Charon prompt, schema and final manifest
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/v7_contract.py --repo-root . \
            --manifest examples/video-only-episode-manifest-v7.template.json
          PYTHONPATH=. python production/v7_contract.py --repo-root . \
            --manifest episodes/video-001/manifest.json --require-production
      - name: Validate canonical Charon profile fingerprints
        run: |
          PYTHONPATH=. python production/canonical_config.py \
            --manifest examples/video-only-episode-manifest-v7.template.json
          PYTHONPATH=. python production/canonical_config.py \
            --manifest episodes/video-001/manifest.json
      - name: Run current Charon contract tests
        run: |
          PYTHONPATH=. python -m unittest -v \
            tests.test_engine_singleton_guard \
            tests.test_master_prompt_contract \
            tests.test_canonical_config \
            tests.test_v7_contract \
            tests.test_v7_orchestrator \
            tests.test_v7_state \
            tests.test_manifest_readiness
      - name: Run current media, provenance and caption regressions
        run: |
          PYTHONPATH=. python -m unittest -v \
            tests.test_caption_alignment \
            tests.test_caption_alignment_grammar \
            tests.test_caption_quality \
            tests.test_forced_timing \
            tests.test_video_fingerprint \
            tests.test_golden_frame_regression \
            tests.test_release_boundary \
            tests.test_storage_policy \
            tests.test_media_anomaly \
            tests.test_narrative_anchor_gate \
            tests.test_asset_reuse_brain \
            tests.test_audio_reuse_v72 \
            tests.test_narration_cache
      - name: Run deterministic Charon orchestration dry-run
        run: |
          PYTHONPATH=. python production/v7_orchestrator.py \
            --repo-root . --manifest episodes/video-001/manifest.json \
            --mode dry-run --report /tmp/v7-dry-run.json
      - name: Parse the production-record schema
        run: python -m json.tool production/schemas/production-record-3.0.0.json >/dev/null
