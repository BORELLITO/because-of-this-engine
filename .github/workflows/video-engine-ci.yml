name: Because Of This canonical V2.1 engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: because-of-this-canonical-ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install thumbnail QA dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Compile canonical V2.1 surface
        run: python -m py_compile production/*.py
      - name: Install real FFmpeg for S01/S12 label smoke tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run V2.1 tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_v21*.py' -v
      - name: Audit acoustic catalog coverage and fail-closed release boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from production.audio_acoustic_fingerprint_v21 import unpack, ALGORITHM, catalog_coverage
          from production.audio_mix_receipt_v21 import ALGORITHM as MIX_ALGORITHM
          catalog = json.loads(Path("episodes/audio-acoustic-fingerprints-v21.json").read_text())
          assert catalog["algorithm"] == ALGORITHM
          assert catalog["source_count"] == len(catalog["sources"]) == 5
          verified = {x["source_sha256"] for x in catalog["sources"]}
          assert "4a84629bdd611489b49f28187c70f2fc6d4a48b11347ef5c05cf301e1cd1fa24" in verified
          assert all(len(unpack(x["fingerprint"])) >= 64 for x in catalog["sources"])
          coverage=catalog_coverage(Path("."))
          assert coverage["status"]=="PASS",coverage
          assert coverage["known_source_count"] == 5, coverage
          assert coverage["covered_count"] == 5, coverage
          assert coverage["missing_source_sha256"] == [], coverage
          assert MIX_ALGORITHM == "verified-local-ffmpeg-mix-replay-v1"
          policy=json.loads(Path("production/active_engine_policy.json").read_text())
          from production.render_v21_final import PROFILE_PATH, _time_signature
          profile=json.loads(PROFILE_PATH.read_text())
          assert profile["output_limiter_limit"] == 0.90
          assert profile["output_limiter_auto_level"] is False
          assert profile["output_true_peak_dbTP_max"] == -1.0
          assert profile["output_loudness_lufs_bounds"] == [-20.0,-13.0]
          assert _time_signature(profile, 65.0) == 70.5
          assert policy["production_enablement"] is False
          assert policy["final_drive_delivery_enablement"] is False
          assert policy["final_delivery_audio_gate"]["receipt_required"] is True
          assert policy["final_delivery_audio_gate"]["independent_ffmpeg_replay"] is True
          assert policy["publication_policy"] == "manual_only"
          print("V21_ACOUSTIC_CATALOG_AND_POSTFLIGHT_FAIL_CLOSED_PASS")
          PY

      - name: Verify final-video Drive delivery fails before any remote network call
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          import tempfile
          from unittest.mock import patch
          from production.final_delivery_v21 import verify_drive_video_delivery
          from production.google_drive_delivery import deliver, DeliveryError
          with tempfile.TemporaryDirectory() as d:
              file=Path(d)/"not-yet-authorized-master.mp4"
              file.write_bytes(b"synthetic fake master"*100)
              report=verify_drive_video_delivery(
                  [file],repo_root=Path("."),
                  production_record_path=Path("episodes/episode-005/production-record.json"),
                  master_video_path=file)
              assert report["status"]=="BLOCKED",report
              assert report["remote_write"]=="NOT_RUN"
              assert any("final_drive_delivery_enablement" in x for x in report["failures"])
              with patch("production.google_drive_delivery.service",
                         side_effect=AssertionError("illegal network access")):
                  try:
                      deliver("TEST","TEST","TEST",[file],"test-delivery")
                  except DeliveryError as exc:
                      assert "Final V2.1 media delivery blocked" in str(exc)
                  else:
                      raise AssertionError("Drive write gate bypassed")
          print("V21_FINAL_VIDEO_DRIVE_DELIVERY_EVIDENCE_GATE_PASS_NO_NETWORK")
          PY

      - name: Enforce canonical final V2.1 render stays blocked without production authority
        run: |
          set +e
          PYTHONPATH=. python production/render_v21_final.py \
            --repo-root . \
            --record episodes/episode-005/production-record.json \
            --preview /tmp/missing-v21-preview.mp4 \
            --preview-report /tmp/missing-v21-preview-report.json \
            --narration /tmp/missing-v21-voice.wav \
            --voice-profile /tmp/missing-v21-voice-profile.json \
            --music /tmp/missing-v21-music.wav \
            --music-candidate /tmp/missing-v21-music-source.json \
            --story-music-context /tmp/missing-v21-story-music.json \
            --soundtrack-candidates /tmp/missing-v21-music-candidates.json \
            --effects-manifest /tmp/missing-v21-sfx.json \
            --sfx sfx:alarm=/tmp/missing-v21-sfx.wav \
            --output /tmp/v21-final-NOT-AUTHORIZED.mp4 \
            --mix-output /tmp/v21-final-NOT-AUTHORIZED-mix.wav \
            --receipt /tmp/v21-final-NOT-AUTHORIZED-receipt.json \
            --report /tmp/v21-final-NOT-AUTHORIZED-report.json > /tmp/v21-final-block.json
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          from production.v21_singleton_guard import audit
          policy=json.loads(Path("production/active_engine_policy.json").read_text())
          assert policy["final_render_entrypoint"] == "production/render_v21_final.py"
          assert policy["final_render_route"]["generate_new_TTS"] is False
          assert policy["production_enablement"] is False
          assert policy["publication_policy"] == "manual_only"
          assert audit(Path("."))["status"] == "V21_SINGLETON_PASS"
          result=json.loads(Path("/tmp/v21-final-block.json").read_text())
          assert result["status"] == "V21_FINAL_RENDER_BLOCKED",result
          assert result["drive_write"] == "NOT_RUN"
          assert result["publication"] == "MANUAL_ONLY_NOT_RUN"
          assert not Path("/tmp/v21-final-NOT-AUTHORIZED.mp4").exists()
          assert not Path("/tmp/v21-final-NOT-AUTHORIZED-mix.wav").exists()
          print("V21_FINAL_RENDER_CANONICAL_ROUTE_IMPLEMENTED_POLICY_BLOCKED")
          PY

      - name: Assert absolute zero additional cost and no external TTS network
        run: |
          PYTHONPATH=. python -m production.zero_cost_v21 --audit-repository --repo-root .
          PYTHONPATH=. python - <<'PY'
          from production.zero_cost_v21 import evaluate_cost
          for op in ("gemini_tts_generate_content","gemini_batch_generate",
                     "paid_render_api","paid_stock_purchase","unknown_service"):
              report = evaluate_cost(op)
              assert report["status"] == "BLOCKED",report
              assert report["external_request_authorized"] is False
          for op in ("existing_charon_audio_reuse","ffmpeg_local_mix","offline_media_qa"):
              assert evaluate_cost(op)["status"] == "PASS"
          print("V21_ZERO_INCREMENTAL_SPEND_FAIL_CLOSED_TEST_PASS")
          PY

      - name: Audit real EP005 Mixkit license scope vs unresolved claims and historical SFX
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from production.soundtrack_release_evidence_v21 import audit
          a = audit(Path("."), "episode-005")
          assert a["status"] == "BLOCKED", a
          evidence = a["evidence"]
          assert evidence["license_for_commercial_online_video"] == "SOURCE_TERMS_CONFIRMED_NOT_GLOBAL_CLAIM_WAIVER", a
          assert evidence["original_music_bytes"] == "SHA256_VERIFIED_IN_EXISTING_PRIVATE_QA_RUN", a
          assert evidence["actual_private_audio_mix"] == "TECHNICAL_PASS_NOT_MASTER_OR_PUBLICATION", a
          assert evidence["new_song_vs_five_known_historical_sources"] == "NO_MATCH_IN_KNOWN_CATALOG_ONLY", a
          assert evidence["content_id_claim_risk"] == "PENDING_PLATFORM_OR_PROVIDER_CASE_EVIDENCE", a
          assert evidence["historical_sfx"] == "ZERO_INDEPENDENT_STEM_PROOFS_DO_NOT_RETROACTIVELY_APPROVE", a
          assert a["historical_inventory"]["historical_master_count"] == 4, a
          assert a["historical_inventory"]["historical_soundtrack_collision_count"] == 1, a
          assert not a["production_authorized"] and not a["publication_authorized"], a
          print("V21_MIXKIT_SOURCE_VALID_BUT_CONTENTID_STORY_SFX_RELEASE_HELD_PASS")
          PY

      - name: Validate active policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("production/active_engine_policy.json").read_text())
          assert policy["active_engine_version"] == "2.1"
          assert policy["canonical_entrypoint"] == "production/canonical_entrypoint.py"
          assert policy["production_enablement"] is False
          assert policy["voice_provider"] == "gemini_tts"
          assert policy["voice_policy"]["voice_name"] == "Charon"
          assert policy["voice_policy"]["model"] == "gemini-3.8-flash-tts"
          assert policy["voice_policy"]["direct_api_route"] == "production/gemini_tts.py"
          assert policy["status"] == "BLOCKED_FOR_PRODUCTION"
          print("V21_POLICY_IDENTITY_PASS")
          PY
      - name: Validate user-approved S09 manifest without render promotion
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from production.visual_plan_contract import validate_visual_plan
          plan=json.loads(Path("episodes/episode-005/visual/asset-acquisition-plan.json").read_text())
          scene=json.loads(Path("episodes/episode-005/visual/scene-asset-manifest.json").read_text())
          report=validate_visual_plan(plan,scene)
          assert report["status"]=="VISUAL_PLAN_CONTRACT_PASS",report
          assert report["manifest_asset_count"]==16,report
          assert report["render_allowed"] is False and report["promotion_allowed"] is False,report
          assert report["global_catalog_updated"] is False,report
          s09=next(s for s in scene["shot_assignments"] if s["shot_id"]=="S09")
          assert s09["assignment"]["candidate_id"]=="pexels-8888977",s09
          asset=next(a for a in scene["assets"] if a["candidate_id"]=="pexels-8888977")
          candidate=next(a for a in plan["candidates"] if a["candidate_id"]=="pexels-8888977")
          assert candidate["rights_status"]=="APPROVED_FOR_MANIFEST_ONLY"
          assert candidate["qa"]["human_approval"]=="APPROVED_FOR_MANIFEST"
          assert asset["sha256"]==candidate["intake_artifact"]["sha256"]
          assert asset["perceptual_hash"]==candidate["intake_artifact"]["perceptual_hash"]
          assert asset["approved_for_render"] is False
          assert candidate["approved_for_render"] is False
          assert not any(a["candidate_id"]=="pexels-12213087" for a in scene["assets"])
          print("EP005_S09_MANIFEST_ONLY_APPROVAL_PASS_NO_RENDER")
          PY

      - name: Reconcile Episode 005 visual evidence (report-only; no rights promotion)
        run: |
          PYTHONPATH=. python production/visual_reconciliation_dossier_v21.py \
            --repo-root . \
            --record episodes/episode-005/production-record.json > /tmp/ep005-rights-dossier.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/ep005-rights-dossier.json").read_text(encoding="utf-8"))
          assert d["status"] == "EVIDENCE_CONSISTENT_NOT_RENDER_AUTHORIZED", d["status"]
          assert d["asset_count"] == 16
          assert d["render_rights_matched_count"] == 16
          assert d["approved_manifest_only_pending_render_rights"] == []
          assert d["pending_visual_approval"] == []
          assert d["source_provenance_mismatches"] == []
          assert d["missing_render_rights"] == []
          assert d["pending_render_rights"] == []
          assert d["pending_recorded_rights"] == []
          assert d["stale_render_rights"] == []
          assert d["rights_ledger_entry_count"] == 16
          assert d["draft_pending_rights_not_canonical"] == []
          assert all(item["render_rights_status"] == "PENDING_INDEPENDENT_RENDER_RIGHTS" for item in d["assets"] if not item["render_rights_matched"])
          assert d["pending_render_rights"] == []
          assert d["render"] == "NOT_RUN"
          assert d["publication"] == "NOT_RUN"
          assert d["production_enablement"] is False
          print("EPISODE005_PENDING_EVIDENCE_RECONCILIATION_ENFORCED_PASS")
          PY

      - name: Verify Episode 005 contract blocks stale visual rights (no render)
        run: |
          set +e
          PYTHONPATH=. python production/canonical_entrypoint.py \
            --repo-root . \
            --manifest episodes/episode-005/production-record.json \
            --report /tmp/episode005-v21-report.json
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/episode005-v21-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "BLOCKED", report
          assert report["blocking_gates"] == ["AUDIO_HISTORY_COVERAGE"], report["blocking_gates"]
          rights = next(g for g in report["checks"] if g.get("ledger") == "rights_ledger")
          assert rights["status"] == "PASS"
          assert rights["failures"] == []
          audio = next(g for g in report["checks"] if g.get("gate") == "AUDIO_HISTORY_COVERAGE")
          assert audio["status"] == "BLOCKED", audio
          assert audio["registry_track_count"] == 5, audio
          assert audio["verified_original_source_count"] == 3, audio
          assert audio["verified_master_audio_count"] == 0, audio
          assert audio["verified_delivered_master_file_count"] == 4, audio
          assert audio["delivered_music_collision_count"] == 1, audio
          assert any("verified completed-master music source reused" in f for f in audio["failures"]), audio
          assert len(audio["historical_identity_collisions"]) >= 1, audio
          assert any("SFX usage coverage" in f for f in audio["failures"]), audio
          assert any("audio history completeness" in f for f in audio["failures"]), audio
          visual = next(g for g in report["checks"] if g.get("gate") == "VISUAL_RIGHTS_CONSISTENCY")
          assert not any("visual assets missing render rights" in f for f in visual["failures"]), visual
          assert visual["status"] == "PASS" and visual["failures"] == [], visual
          assert not any("pexels-11764431" in f for f in visual["failures"]), visual
          assert not any("nasa-svs-geos5-clouds-no-labels-4819" in f for f in visual["failures"]), visual
          assert not any("pexels-8888977" in f for f in visual["failures"]), visual
          assert not any("pexels-8888977: plan does not record human manifest approval" in f for f in visual["failures"]), visual
          scene_truth = next(g for g in report["checks"] if g.get("gate") == "SCENE_DISCLOSURES_V21")
          assert scene_truth["status"] == "PASS", scene_truth
          assert scene_truth["scene_count"] == 2
          assert set(scene_truth["checked_shots"]) == {"S01", "S12"}
          assert scene_truth["final_video_verified"] is False
          assert scene_truth["publication_authorized"] is False
          decision = next(g for g in report["checks"] if g.get("gate") == "RIGHTS_AUTONOMY_V21")
          assert decision["status"] == "PASS", decision
          assert decision["auto_approved_count"] == 7 and decision["blocked_count"] == 0
          assert report["production_enablement"] is False
          assert report["media_generation"] == "NOT_RUN"
          assert report["render"] == "NOT_RUN"
          assert report["publication"] == "MANUAL_ONLY_NOT_RUN"
          print("EPISODE005_CROSS_LEDGER_EXPECTED_BLOCK_PASS")
          PY

      - name: Audit autonomous source-specific render decisions (7 labelled, 0 blocked)
        run: |
          PYTHONPATH=. python production/rights_autonomy_v21.py \
            --repo-root . \
            --record episodes/episode-005/production-record.json > /tmp/ep005-rights-decisions.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/ep005-rights-decisions.json").read_text())
          assert data["status"] == "PASS", data
          assert data["auto_approved_count"] == 7, data
          assert data["blocked_count"] == 0, data
          allowed={x["asset_id"] for x in data["decisions"] if x["allow_scoped_render"]}
          blocked={x["asset_id"] for x in data["decisions"] if not x["allow_scoped_render"]}
          assert allowed == {"pixabay-radio-vintage-old-171435",
                             "pixabay-radar-black-green-target-symbol-57670",
                             "pexels-5523892","pexels-12590338","pexels-8888977",
                             "pexels-11764431","nasa-svs-geos5-clouds-no-labels-4819"},allowed
          assert blocked == set(),blocked
          assert data["publication_executed"] is False
          assert data["render_executed"] is False
          print("EP005_RIGHTS_AUTONOMY_DECISION_PASS_RELEASE_FAIL_CLOSED")
          PY

      - name: Enforce singleton runtime
        run: PYTHONPATH=. python production/v21_singleton_guard.py --repo-root .
      - name: Test legacy adapter delegates to canonical entrypoint
        run: |
          set +e
          PYTHONPATH=. python production/v7_orchestrator.py \
            --repo-root . \
            --manifest examples/video-only-episode-manifest-v7.template.json \
            --mode dry-run \
            --report /tmp/v21-adapter-report.json
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          with open("/tmp/v21-adapter-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["status"] == "BLOCKED"
          assert "PRODUCTION_RECORD_SCHEMA" in report["blocking_gates"]
          assert report["render"] == "NOT_RUN"
          print("LEGACY_ADAPTER_FAIL_CLOSED_PASS")
          PY
      - name: Confirm checkout is clean
        run: test -z "$(git status --porcelain)"