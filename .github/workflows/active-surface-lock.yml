name: Because Of This active surface lock

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  active-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile and validate the only active runtime surface
        run: |
          python -m py_compile production/active_surface_lock_v21.py production/v21_singleton_guard.py production/canonical_entrypoint.py
          PYTHONPATH=. python production/active_surface_lock_v21.py --repo-root .
          PYTHONPATH=. python -m unittest tests.test_active_surface_lock_v21 tests.test_engine_singleton_guard -v
