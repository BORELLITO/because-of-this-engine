name: Because Of This Copilot technical gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/copilot-technical-gate.yml"
      - "docs/COPILOTO_CANONICO_V1.md"
      - "ESTADO_ATUAL.md"
      - "episodes/brazil-files/episode-001/case-brief.json"
      - "episodes/brazil-files/episode-001/narrative-beat-dossier.json"
      - "production/brazil_files_clip_source_registry_v1.json"
      - "docs/BRAZIL_FILES_CLIP_SOURCE_REGISTRY_V1.md"
      - "episodes/brazil-files/episode-001/clip-research-seed.json"
      - "episodes/brazil-files/episode-001/clip-receipts/B04-C02.json"
      - "episodes/brazil-files/episode-001/clip-receipts/B05-C03.json"
      - "episodes/brazil-files/episode-001/namespace-lock.json"
      - "docs/BRAZIL_FILES_EPISODE_001_CLIP_RESEARCH_SEED_V1.md"
      - "docs/BRAZIL_FILES_CANONICAL_CROSSWALK_V1.md"
      - "docs/BRAZIL_FILES_EPISODE_001_PREFLIGHT_V1.md"
      - "production/copilot_contract_v1.json"
      - "production/copilot_queue_v1.py"
      - "production/copilot_analysis_agents_v1.py"
      - "production/copilot_executor_registry_v1.py"
      - "production/copilot_provider_readiness_v1.py"
      - "production/copilot_technical_gate_v1.py"
      - "production/brazil_files_canonical_crosswalk_v1.py"
      - "production/brazil_files_ep001_preflight_v1.py"
      - "production/brazil_files_clip_receipt_gate_v1.py"
      - "production/copilot_runflow_handoff_v1.py"
      - "tests/test_copilot_analysis_agents.py"
      - "tests/test_copilot_executor_registry.py"
      - "tests/test_copilot_provider_readiness.py"
      - "tests/test_copilot_contract.py"
      - "tests/test_copilot_levels.py"
      - "tests/test_copilot_queue_v1.py"
      - "tests/test_copilot_brazil_crosswalk.py"
      - "tests/test_copilot_brazil_files_ep001_preflight.py"
      - "tests/test_copilot_clip_receipt_gate.py"
      - "tests/test_copilot_clip_source_registry.py"
      - "tests/test_copilot_clip_research_seed.py"
      - "tests/test_copilot_runflow_handoff.py"
      - "tests/test_copilot_state_memory.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: because-of-this-copilot-technical-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  copilot-technical-gate:
    name: Consolidated copilot technical gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run consolidated scope, privacy, compilation and regression gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: PYTHONPATH=. python production/copilot_technical_gate_v1.py --repo-root . --base-ref "$BASE_REF"

