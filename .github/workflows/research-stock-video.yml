name: Research stock video candidates

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Episode render manifest path"
        required: true
        default: "examples/mars-climate-orbiter-render-manifest-v1.json"
        type: string
      scene:
        description: "Scene id; leave blank to research every scene"
        required: false
        default: ""
        type: string
      provider:
        description: "Provider to query"
        required: true
        default: "pexels"
        type: choice
        options:
          - pexels
          - pixabay
          - all
      query:
        description: "Optional query override for the selected scene"
        required: false
        default: ""
        type: string
      max_results:
        description: "Maximum candidates per provider"
        required: true
        default: "6"
        type: string

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Research candidates
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          python production/stock_video_research.py             --manifest "${{ inputs.manifest }}"             --scene "${{ inputs.scene }}"             --provider "${{ inputs.provider }}"             --max-results "${{ inputs.max_results }}"             --query "${{ inputs.query }}"             --output "${RUNNER_TEMP}/stock-video-candidates.json"

      - name: Publish candidate review summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/stock-video-candidates.json
        run: |
          {
            echo "## Stock-video research"
            if [ -f "${REPORT}" ]; then
              python - "${REPORT}" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"- video_id: {report.get('video_id')}")
          print(f"- browser_review_required: {report.get('browser_review_required')}")
          print("- approval_status: REVIEW_REQUIRED")
          for scene in report.get("scenes", []):
              print(f"### {scene.get('scene_id')} — {scene.get('query')}")
              print(f"- candidates: {len(scene.get('candidates', []))}")
              for candidate in scene.get("candidates", [])[:5]:
                  print(f"- score={candidate.get('relevance_score')} | {candidate.get('provider')} | {candidate.get('title')}")
                  print(f"  source: {candidate.get('source_page_url')}")
                  print(f"  license: {candidate.get('license_url')}")
              for error in scene.get("provider_errors", []):
                  print(f"- provider_error: {error}")
          PY
            else
              echo "- status: research did not produce a candidate report"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
