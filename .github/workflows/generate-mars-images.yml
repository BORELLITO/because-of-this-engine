name: Generate free Mars visuals

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene to generate"
        required: true
        default: "S01"
        type: choice
        options:
          - S01
          - S02
          - S03
          - S04
          - S05
          - S06
          - ALL

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Google Drive destination
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1GUOcSRo91xxypW-GgCchubhx9FaMGk5u"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python production/google_drive_delivery.py --preflight
      - name: Generate approved-provider assets
        env:
          IMAGE_PROVIDER: nasa
        run: python production/generate_mars_images.py --provider nasa --scene "${{ inputs.scene }}" --max-requests 6
      - name: Install FFmpeg for motion assembly
        if: ${{ inputs.scene == 'ALL' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Assemble factual motion source when all scenes are ready
        if: ${{ inputs.scene == 'ALL' }}
        run: python production/build_mars_visual_ai.py
      - name: Assemble editorial clarity motion source
        if: ${{ inputs.scene == 'ALL' }}
        run: python production/build_mars_visual_editorial.py

      - name: Deliver generated assets and motion sources to Google Drive
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1GUOcSRo91xxypW-GgCchubhx9FaMGk5u"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--path production/mars-assets)
          for file in \
            production/mars-climate-orbiter-visual-ai-v1.mp4 \
            production/mars-climate-orbiter-visual-ai-v1.mp4.json \
            production/mars-climate-orbiter-visual-editorial-v1.mp4 \
            production/mars-climate-orbiter-visual-editorial-v1.mp4.json \
            production/mars-climate-orbiter-visual-editorial-v2.mp4 \
            production/mars-climate-orbiter-visual-editorial-v2.mp4.json
          do
            if [ -f "$file" ]; then
              ARGS+=(--path "$file")
            fi
          done
          python production/google_drive_delivery.py \
            --collection "ASSETS" \
            --delivery-name "mars-visuals-${{ inputs.scene }}-${{ github.run_id }}" \
            "${ARGS[@]}"
