name: Render authorial episode

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Episode render manifest path"
        required: true
        default: "examples/mars-climate-orbiter-render-manifest-v1.json"
        type: string
      mode:
        description: "Render size"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - final

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate authorial manifest
        run: |
          python production/render_authorial_episode.py \
            --manifest "${{ inputs.manifest }}" \
            --validate-only

      - name: Require preview approval for final
        if: inputs.mode == 'final'
        run: |
          python production/require_preview_approval.py \
            --manifest "${{ inputs.manifest }}"

      - name: Render episode
        run: |
          python production/render_authorial_episode.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}"

      - name: Validate rendered release
        run: |
          python production/validate_authorial_episode.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --report "examples/rendered/authorial-validation-${{ inputs.mode }}.json"

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: because-of-this-${{ inputs.mode }}-validated-package
          path: |
            examples/rendered/*.mp4
            examples/rendered/*.json
            ${{ inputs.manifest }}
            examples/assets/*.json
          if-no-files-found: error
