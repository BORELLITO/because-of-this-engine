name: Render authorial episode

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Episode render manifest path"
        required: true
        default: "examples/mars-climate-orbiter-render-manifest-v1.json"
        type: string
      mode:
        description: "Render size"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - final

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static FFmpeg with retries
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ffmpeg"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
            --output "${RUNNER_TEMP}/ffmpeg.tar.xz"
          tar -xJf "${RUNNER_TEMP}/ffmpeg.tar.xz" -C "${RUNNER_TEMP}/ffmpeg"
          FFMPEG_DIR="$(find "${RUNNER_TEMP}/ffmpeg" -maxdepth 1 -mindepth 1 -type d -name 'ffmpeg-*static' -print -quit)"
          test -n "${FFMPEG_DIR}"
          echo "${FFMPEG_DIR}" >> "${GITHUB_PATH}"
          "${FFMPEG_DIR}/ffmpeg" -version | head -n 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run engine regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate authorial manifest and motion contract
        run: |
          python production/render_authorial_episode.py \
            --manifest "${{ inputs.manifest }}" \
            --validate-only

      - name: Run non-destructive asset preflight
        run: |
          python production/preflight_authorial_episode.py \
            --manifest "${{ inputs.manifest }}"

      - name: Create narration-locked master contract
        run: |
          python production/create_master_contract.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}"

      - name: Require preview approval for final
        if: inputs.mode == 'final'
        run: |
          python production/require_preview_approval.py \
            --manifest "${{ inputs.manifest }}"

      - name: Render episode
        run: |
          python production/render_authorial_episode.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}"

      - name: Validate rendered release
        run: |
          python production/validate_authorial_episode.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --report "examples/rendered/authorial-validation-${{ inputs.mode }}.json"

      - name: Validate master timeline and post-render sync
        run: |
          python production/validate_master_timeline.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --report "examples/rendered/master-timeline-${{ inputs.mode }}.json"

      - name: Publish validation receipt
        if: always()
        run: |
          REPORT="examples/rendered/master-timeline-${{ inputs.mode }}.json"
          {
            echo "## Because of This — validation receipt"
            if [ -f "${REPORT}" ]; then
              python - "${REPORT}" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"- status: {report.get('status')}")
          print(f"- video_id: {report.get('video_id')}")
          print(f"- mode: {report.get('mode')}")
          print(f"- narration: {report.get('timeline', {}).get('audio_duration_seconds')} s")
          print(f"- captions: {report.get('timeline', {}).get('caption_count')}")
          print(f"- post_render_sync: {report.get('media', {}).get('post_render_sync')}")
          print(f"- stale_artifact_check: {report.get('stale_artifact_check')}")
          gates = report.get("critical_gates", {})
          print(f"- critical_gates: {', '.join(k for k, v in gates.items() if v)}")
          PY
            else
              echo "- status: no validation receipt was produced"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload validated package (best effort)
        # GitHub artifact storage can be temporarily quota-blocked even after all
        # quality gates pass. Delivery availability must not rewrite a valid render
        # as a content/synchronization failure.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: because-of-this-${{ inputs.mode }}-validated-package
          path: |
            examples/rendered/*.mp4
            examples/rendered/*.json
            ${{ inputs.manifest }}
            examples/assets/*.json
          if-no-files-found: error
          retention-days: 1
