name: One-off Drive preflight

on:
  push:
    paths:
      - ".github/workflows/one-off-drive-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Drive dependencies
        run: python -m pip install "google-api-python-client>=2,<3" "google-auth>=2,<3" "google-auth-httplib2>=0.2,<1"
      - name: Verify Drive connection
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1GUOcSRo91xxypW-GgCchubhx9FaMGk5u"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python production/google_drive_delivery.py --preflight
