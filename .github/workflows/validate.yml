name: Validate engine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile narrate.py production/*.py

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON metadata syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = list(Path('production').glob('*.json')) + list(Path('examples').glob('*.json'))
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'JSON metadata valid: {len(paths)} files')
          PY

      - name: Validate authorial manifests without rendering
        run: |
          python production/render_authorial_episode.py             --manifest examples/mars-climate-orbiter-render-manifest-v1.json             --validate-only
