name: V7.2 Reuse-First audit CI (NO MEDIA GENERATION)

on:
  push:
    branches: [experiment/v7.2-reuse-first-piper]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v72-reuse-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-reuse-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated current-main based experiment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (tests only, never TTS generation)
        run: python -m pip install -r requirements.lock.txt
      - name: Validate experiments compile
        run: python -m py_compile experimental/v72/*.py production/*.py
      - name: Preserve canonical Piper V7.1 profile
        run: |
          PYTHONPATH=. python production/v7_singleton_guard.py --repo-root .
          PYTHONPATH=. python production/v7_contract.py --repo-root . --manifest episodes/video-001/manifest.json --require-production
      - name: V7.2 and cache / reuse regressions
        run: |
          PYTHONPATH=. python -m unittest -v \
            tests.test_reuse_first_v72 \
            tests.test_v72_free_integrations \
            tests.test_asset_reuse_brain \
            tests.test_audio_reuse_v72 \
            tests.test_narration_cache
      - name: V7.1 canonical tests (do not downgrade)
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_v7*.py' -v
      - name: Existing preview reuse-first plan, no regeneration
        run: |
          PYTHONPATH=. python experimental/v72/reuse_first.py \
            --manifest episodes/video-001/preview-manifest.json \
            --script episodes/video-001/script.txt \
            --catalog experimental/v72/verified_preview_001.json \
            --report "${RUNNER_TEMP}/reuse-first-preview-001.json"
      - name: Shot source metadata review (no pixel approval)
        run: |
          PYTHONPATH=. python experimental/v72/shot_review.py \
            --manifest episodes/video-001/preview-manifest.json \
            --report "${RUNNER_TEMP}/shot-review-001.json"
      - name: Confirm no costly media workflow was invoked
        run: |
          echo "NO_TTS_OR_RENDER_OR_DRIVE_WRITE"
          echo "V7_1_MAIN_UNMODIFIED"
          echo "V7_2_NEEDS_HUMAN_PREVIEW_APPROVAL"
