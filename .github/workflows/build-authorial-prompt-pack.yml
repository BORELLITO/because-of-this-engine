name: Build authorial prompt pack

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest path"
        required: true
        default: "examples/mars-climate-orbiter-authorial-manifest-v1.json"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Google Drive destination
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1GUOcSRo91xxypW-GgCchubhx9FaMGk5u"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python production/google_drive_delivery.py --preflight

      - name: Build prompt pack
        run: |
          python production/build_authorial_prompt_pack.py \
            --manifest "${{ inputs.manifest }}" \
            --output production/authorial-prompt-pack.json

      - name: Deliver prompt pack to Google Drive
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1GUOcSRo91xxypW-GgCchubhx9FaMGk5u"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python production/google_drive_delivery.py \
            --collection "PROMPT_PACKS" \
            --delivery-name "prompt-pack-${{ github.run_id }}" \
            --path production/authorial-prompt-pack.json
