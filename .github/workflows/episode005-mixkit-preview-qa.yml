name: Because Of This V2.1 Episode005 Mixkit Suspense Audio Private QA

# Strictly editorial listening QA. No production release/Drive/TTS/publication,
# no new music-engine entrypoint. Source MP3 and raw Charon never enter Git.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [".github/workflows/episode005-mixkit-preview-qa.yml"]

permissions:
  contents: read
  actions: read

jobs:
  private-audio-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout existing canonical V2.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install real FFmpeg and inspect source contracts
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          PYTHONPATH=. python -m py_compile production/audio_mix_receipt_v21.py production/audio_acoustic_fingerprint_v21.py production/render_v21_final.py
      - name: Download Mixkit Feedback Dreams from exact browser-confirmed official asset URL
        run: |
          set -euo pipefail
          mkdir -p private/ep005
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            --proto '=https' --tlsv1.2 -A 'Mozilla/5.0 (compatible; BOT-Audio-QA/1.0)' \
            'https://assets.mixkit.co/music/588/588.mp3' -o private/ep005/source.mp3
          test "$(stat -c '%s' private/ep005/source.mp3)" -gt 100000
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 private/ep005/source.mp3
      - name: Retrieve already approved Gemini Charon Episode005 artifact with NO TTS call
        uses: actions/download-artifact@v4
        with:
          name: episode005-gemini-charon-captioned
          github-token: ${{ github.token }}
          run-id: 42278428885
          path: private/ep005/charon
      - name: Verify real stock MP3, check 5 historical songs and render private spoken-word music mix
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import array, json, math, re, subprocess, wave
          from pathlib import Path
          from production.audio_acoustic_fingerprint_v21 import catalog_coverage, review_file
          from production.audio_mix_receipt_v21 import execute_with_receipt, verify_receipt, file_sha256
          from production.render_v21_final import build_audio_mix_command, _time_signature, PROFILE_PATH
          from production.render_v21_preview import validate_voice_profile, media_duration
          root=Path('private/ep005')
          music=root/'source.mp3'
          voice=root/'charon/narration.wav'
          identity=validate_voice_profile(root/'charon/voice-profile.json',voice)
          assert identity['audio_sha256']=='0746581eae60c3cccf69173f24658b8dc49fdbb85c74d060c26b7dcecae66ebe',identity
          voice_seconds=media_duration(voice)
          profile=json.loads(PROFILE_PATH.read_text())
          total=_time_signature(profile,voice_seconds)
          duration=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration',
                                   '-of','default=nw=1:nk=1',str(music)],check=True,capture_output=True,text=True)
          song_seconds=float(duration.stdout.strip())
          assert song_seconds>=total+0.03,(song_seconds,total)
          coverage=catalog_coverage(Path('.'))
          acoustic=review_file(music,Path('episodes/audio-acoustic-fingerprints-v21.json'))
          report={'status':'CANDIDATE_NOT_PRODUCTION_APPROVED','episode_id':'episode-005',
                  'song':'Feedback Dreams','artist':'Eugenio Mininni','provider':'Mixkit',
                  'provider_listing':'https://mixkit.co/free-stock-music/atmospheres/',
                  'browser_verified_original_mp3':'https://assets.mixkit.co/music/588/588.mp3',
                  'stock_music_license':'https://mixkit.co/license/modal/musicFree/',
                  'original_music_sha256':file_sha256(music),
                  'original_music_duration_seconds':song_seconds,
                  'charon_sha256':identity['audio_sha256'],
                  'voice_duration_seconds':voice_seconds,
                  'full_audio_seconds':total,
                  'catalog_coverage':coverage,'acoustic_history_review':acoustic,
                  'content_id_clearance':'PENDING_REAL_SOURCE_REVIEW',
                  'editorial_listening_approval':'PENDING',
                  'production_enablement':False,'publication_authorized':False,
                  'tts_requests':0,'drive_written':False,'visual_render':'NOT_RUN',
                  'original_stock_music_uploaded_to_git_or_artifact':False}
          (root/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          assert coverage['status']=='PASS',coverage
          assert acoustic['status']=='PASS',acoustic
          mix=root/'working-mix.wav'
          receipt=root/'receipt.json'
          argv=build_audio_mix_command(voice,music,{},mix,
                 voice_seconds=voice_seconds,profile=profile)
          execute_with_receipt('episode-005',argv,{'narration':voice,'music':music},mix,receipt)
          proof=verify_receipt(receipt,replay=True)
          assert proof['status']=='PASS',proof
          assert set(proof['source_contributions_confirmed'])=={'narration','music'},proof
          preview=root/'BOT_EP005_Feedback_Dreams_Charon_Private_QA.mp3'
          subprocess.run(['ffmpeg','-nostdin','-hide_banner','-v','error','-i',str(mix),
                          '-c:a','libmp3lame','-b:a','192k','-y',str(preview)],
                          check=True,capture_output=True,timeout=120)
          measured=subprocess.run(['ffmpeg','-nostdin','-hide_banner','-v','info',
                          '-i',str(preview),'-map','0:a:0','-af','ebur128=peak=true',
                          '-f','null','-'],check=True,capture_output=True,text=True,timeout=130)
          summary=measured.stderr.rsplit('Summary:',1)[-1]
          lufs=float(re.search(r'Integrated loudness:\s*I:\s*(-?\d+(?:\.\d+)?)\s*LUFS',summary).group(1))
          peak=float(re.search(r'True peak:\s*Peak:\s*(-?\d+(?:\.\d+)?)\s*dBFS',summary).group(1))
          assert -20<=lufs<=-13 and peak<=-1,(lufs,peak)
          with wave.open(str(mix),'rb') as w:
              assert w.getnchannels()==1 and w.getsampwidth()==2
              rate=w.getframerate()
              def rms(a,b):
                  w.setpos(min(w.getnframes(),round(a*rate)))
                  arr=array.array('h');arr.frombytes(w.readframes(max(1,round((b-a)*rate))))
                  return math.sqrt(sum(x*x for x in arr)/max(1,len(arr)))
              early=rms(voice_seconds+.12,voice_seconds+.8)
              late=rms(total-.25,total-.05)
          assert early>10 and late<early*.6,(early,late)
          report.update({'status':'PRIVATE_AUDIO_QA_TECHNICAL_PASS_NOT_RELEASE_APPROVED',
                'mix_receipt_replayed':True,'confirmed_stems':proof['source_contributions_confirmed'],
                'music_gain':profile['music_gain'],'sidechain':profile['music_ducking'],
                'outro_seconds':profile['outro_seconds'],'music_fade_seconds':profile['music_fade_out_seconds'],
                'outro_rms_before_fade':early,'outro_rms_at_black':late,
                'preview_integrated_loudness_lufs':lufs,'preview_true_peak_dbTP':peak,
                'preview_mp3_sha256':file_sha256(preview),
                'preview_file':preview.name,
                'release_authorized':False})
          (root/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('EP005_MIXKIT_PRIVATE_AUDIO_QA_TECHNICAL_PASS',json.dumps({
              'music_sha256':report['original_music_sha256'],
              'lufs':lufs,'true_peak':peak,'preview_sha256':report['preview_mp3_sha256']}))
          PY
      - name: Delete raw soundtrack, narration and internal stems before uploading any artifacts
        if: always()
        run: |
          rm -f private/ep005/source.mp3 private/ep005/working-mix.wav private/ep005/receipt.json
          rm -rf private/ep005/charon
      - name: Deliver short-lived private listening preview and factual QA report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode005-feedback-dreams-private-audio-qa
          path: |
            private/ep005/report.json
            private/ep005/BOT_EP005_Feedback_Dreams_Charon_Private_QA.mp3
          if-no-files-found: warn
          retention-days: 14
