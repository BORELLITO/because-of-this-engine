name: Because Of This V7.4 Episode 004 final release
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Preview manifest: episodes/<episode>/preview-manifest.json"
        required: true
        default: "episodes/video-004/preview-manifest.json"
        type: string
      tts_request:
        description: "TTS request mode: RUN_ONCE permits one Gemini call; CACHE_ONLY never calls Gemini"
        required: true
        default: "CACHE_ONLY"
        type: choice
        options:
          - RUN_ONCE
          - CACHE_ONLY

permissions:
  contents: read

concurrency:
  group: because-of-this-v7.4-current-engine-charon-final-episode-004-${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}
  cancel-in-progress: true

env:
  BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"
  PYTHONUNBUFFERED: "1"

jobs:
  preflight-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      existing_preview: ${{ steps.reuse_check.outputs.reuse }}
    steps:
      - name: Checkout for deterministic reuse check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compute reuse-first fingerprint
        id: fingerprint
        env:
          MANIFEST: ${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/reuse_first.py fingerprint \
            --manifest "${MANIFEST}" \
            --mode final \
            --output "${RUNNER_TEMP}/reuse-fingerprints.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Restore verified final receipt
        id: final_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/.cache/final
          key: because-of-this-final-${{ steps.fingerprint.outputs.final_key }}

      - name: Install Drive verification dependencies on exact cache hit
        if: steps.final_cache.outputs.cache-hit == 'true'
        run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Validate reusable preview receipt
        id: reuse_check
        env:
          CACHE_HIT: ${{ steps.final_cache.outputs.cache-hit }}
          FINGERPRINTS: ${{ runner.temp }}/reuse-fingerprints.json
          RECEIPT: episodes/video-004/.cache/final/receipt.json
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${CACHE_HIT}" != "true" ]; then
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
            echo "REUSE_MISS_NO_VERIFIED_FINAL_RECEIPT"
            exit 0
          fi
          if ! PYTHONPATH=. python production/google_drive_delivery.py \
            --verify-receipt "${RECEIPT}"; then
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
            echo "REUSE_REJECTED_DRIVE_RECEIPT_NOT_VERIFIED"
            exit 0
          fi
          if PYTHONPATH=. python production/reuse_first.py verify-receipt \
            --fingerprints "${FINGERPRINTS}" --receipt "${RECEIPT}"; then
            echo "reuse=true" >> "${GITHUB_OUTPUT}"
            python - "${RECEIPT}" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          delivery = value.get("delivery") or {}
          print("REUSE_HIT_FINAL_KEY=" + str((value.get("fingerprints") or {}).get("final_key", "")))
          print("REUSE_HIT_DRIVE_URL=" + str(delivery.get("delivery_folder_url", "")))
          PY
          else
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
            echo "REUSE_REJECTED_RECEIPT_INVALID"
          fi

  final:
    needs: preflight-reuse
    if: needs.preflight-reuse.outputs.existing_preview != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected preview branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate preview manifest scope
        env:
          MANIFEST: ${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}
        run: |
          set -euo pipefail
          test "${MANIFEST}" = "episodes/video-004/preview-manifest.json"
          test -f "${MANIFEST}"
          python - "${MANIFEST}" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value.get("lifecycle_status") != "FINAL_APPROVED":
              raise SystemExit("final manifest must be FINAL_APPROVED")
          if value.get("human_approval_required") is not True:
              raise SystemExit("final manifest must retain human approval requirement")
          approval = value.get("human_approval") or {}
          if approval.get("status") != "PASS":
              raise SystemExit("final manifest must contain human_approval.status=PASS")
          if (value.get("editorial_qa") or {}).get("status") != "PASS":
              raise SystemExit("final manifest must contain editorial_qa.status=PASS")
          print("FINAL_RELEASE_SCOPE_PASS")
          PY

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Compute reuse-first fingerprints
        id: fingerprint
        env:
          MANIFEST: ${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/reuse_first.py fingerprint \
            --manifest "${MANIFEST}" \
            --mode final \
            --output "${RUNNER_TEMP}/reuse-fingerprints.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Restore verified Drive asset cache
        id: asset_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/assets
          key: because-of-this-assets-${{ steps.fingerprint.outputs.asset_key }}
          restore-keys: |
            because-of-this-assets-

      - name: Validate canonical Charon contract
        run: |
          PYTHONPATH=. python production/v7_contract.py \
            --repo-root . --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" --require-production

      - name: Gemini TTS Charon preflight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          PYTHONPATH=. python production/gemini_tts.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" --preflight

      - name: Restore identical existing Charon narration from Drive cache
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Explicitly allow reuse of the prior verified Charon audio because only beat segmentation changed.
          BECAUSE_OF_THIS_LEGACY_NARRATION_CACHE_KEYS: d75ce6d950ba29fc0fa14aa8e303d54f23ea73cf55f7b8c4edd50d80b0644be8
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/narration_cache.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" --restore \
            --status-file "${RUNNER_TEMP}/charon-cache-result.json"
          python - "${RUNNER_TEMP}/charon-cache-result.json" <<'PY'
          import json, os, sys
          status = json.load(open(sys.argv[1], encoding="utf-8"))["status"]
          if status not in {"NARRATION_CACHE_HIT", "NARRATION_CACHE_MISS"}:
              raise SystemExit("Unexpected Charon cache status")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("CHARON_CACHE_HIT=" + ("true" if status == "NARRATION_CACHE_HIT" else "false") + "\n")
          print("CHARON_CACHE_REUSE_STATUS=" + status)
          PY

      - name: Recheck Charon cache immediately before provider request
        if: env.CHARON_CACHE_HIT != 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Repeat the same explicit legacy lookup immediately before the provider gate.
          BECAUSE_OF_THIS_LEGACY_NARRATION_CACHE_KEYS: d75ce6d950ba29fc0fa14aa8e303d54f23ea73cf55f7b8c4edd50d80b0644be8
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/narration_cache.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" --restore \
            --status-file "${RUNNER_TEMP}/charon-cache-recheck.json"
          python - "${RUNNER_TEMP}/charon-cache-recheck.json" <<'PY'
          import json, os, sys
          status = json.load(open(sys.argv[1], encoding="utf-8"))["status"]
          if status not in {"NARRATION_CACHE_HIT", "NARRATION_CACHE_MISS"}:
              raise SystemExit("Unexpected Charon cache recheck status")
          if status == "NARRATION_CACHE_HIT":
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("CHARON_CACHE_HIT=true\n")
          print("CHARON_CACHE_RECHECK_STATUS=" + status)
          PY

      - name: Arm one provider request or fail closed
        env:
          TTS_REQUEST: ${{ inputs.tts_request || 'CACHE_ONLY' }}
        run: |
          set -euo pipefail
          if [ "${CHARON_CACHE_HIT:-false}" = "true" ]; then
            echo "CHARON_PROVIDER_REQUEST_SKIPPED_CACHE_HIT"
            exit 0
          fi
          if [ "${TTS_REQUEST}" != "RUN_ONCE" ]; then
            echo "CHARON_PROVIDER_REQUEST_BLOCKED_CACHE_ONLY"
            echo "No verified Drive cache exists; select RUN_ONCE explicitly to authorize one Gemini request."
            exit 1
          fi
          echo "CHARON_PROVIDER_REQUEST_ALLOWED=true" >> "${GITHUB_ENV}"
          echo "CHARON_PROVIDER_REQUEST_BUDGET=1" >> "${GITHUB_ENV}"
          echo "CHARON_PROVIDER_REQUEST_ARMED=one"

      - name: Generate at most one missing Charon narration
        if: env.CHARON_CACHE_HIT != 'true' && env.CHARON_PROVIDER_REQUEST_ALLOWED == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_REQUEST_BUDGET: "1"
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/gemini_tts.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" \
            --input "episodes/video-004/script.txt" \
            --output-dir "episodes/video-004/audio"

      - name: Store newly generated Charon narration in verified Drive cache
        if: env.CHARON_CACHE_HIT != 'true' && env.CHARON_PROVIDER_REQUEST_ALLOWED == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          PYTHONPATH=. python production/narration_cache.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" --store

      - name: Prepare Vosk cache directory
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/because-of-this-vosk"
          mkdir -p "${root}/primary" "${root}/secondary"
          echo "VOSK_CACHE_ROOT=${root}" >> "${GITHUB_ENV}"
          echo "VOSK_MODEL_DIR=${root}/primary/vosk-model-en-us-0.22-lgraph" >> "${GITHUB_ENV}"
          echo "VOSK_SECONDARY_MODEL_DIR=${root}/secondary/vosk-model-small-en-us-0.15" >> "${GITHUB_ENV}"

      - name: Restore Vosk alignment model cache
        id: vosk_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/because-of-this-vosk
          key: because-of-this-vosk-${{ runner.os }}-v1

      - name: Install independent Vosk alignment models when absent
        run: |
          set -euo pipefail
          if [ ! -d "${VOSK_MODEL_DIR}" ]; then
            curl --fail --location --retry 5 --retry-all-errors \
              "https://alphacephei.com/vosk/models/vosk-model-en-us-0.22-lgraph.zip" \
              --output "${VOSK_CACHE_ROOT}/primary/model.zip"
            unzip -q "${VOSK_CACHE_ROOT}/primary/model.zip" -d "${VOSK_CACHE_ROOT}/primary"
          fi
          if [ ! -d "${VOSK_SECONDARY_MODEL_DIR}" ]; then
            curl --fail --location --retry 5 --retry-all-errors \
              "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
              --output "${VOSK_CACHE_ROOT}/secondary/model.zip"
            unzip -q "${VOSK_CACHE_ROOT}/secondary/model.zip" -d "${VOSK_CACHE_ROOT}/secondary"
          fi

      - name: Save Vosk alignment model cache
        if: steps.vosk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/because-of-this-vosk
          key: because-of-this-vosk-${{ runner.os }}-v1

      - name: Restore alignment and caption cache
        id: alignment_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/.cache/alignment
          key: because-of-this-alignment-${{ steps.fingerprint.outputs.alignment_key }}-${{ steps.fingerprint.outputs.caption_key }}

      - name: Build or reuse forced-alignment captions and story coverage
        run: |
          set -euo pipefail
          mkdir -p episodes/video-004/.cache/alignment episodes/video-004/captions episodes/video-004/rendered
          if [ -f episodes/video-004/.cache/alignment/narration.alignment.json ] && \
             [ -f episodes/video-004/.cache/alignment/narration.ass ] && \
             [ -f episodes/video-004/.cache/alignment/narration-coverage.json ]; then
            cp episodes/video-004/.cache/alignment/narration.alignment.json episodes/video-004/captions/narration.alignment.json
            cp episodes/video-004/.cache/alignment/narration.ass episodes/video-004/captions/narration.ass
            cp episodes/video-004/.cache/alignment/narration-coverage.json episodes/video-004/rendered/narration-coverage.json
            echo "ALIGNMENT_CACHE_HIT=true" >> "${GITHUB_ENV}"
            echo "ALIGNMENT_REUSE_HIT"
          else
            PYTHONPATH=. python production/align_captions.py \
              --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" \
              --model-dir "${VOSK_MODEL_DIR}" \
              --secondary-model-dir "${VOSK_SECONDARY_MODEL_DIR}"
            PYTHONPATH=. python production/story_intelligence.py \
              --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" \
              --alignment "episodes/video-004/captions/narration.alignment.json" \
              --report "episodes/video-004/rendered/narration-coverage.json"
            cp episodes/video-004/captions/narration.alignment.json episodes/video-004/.cache/alignment/narration.alignment.json
            cp episodes/video-004/captions/narration.ass episodes/video-004/.cache/alignment/narration.ass
            cp episodes/video-004/rendered/narration-coverage.json episodes/video-004/.cache/alignment/narration-coverage.json
            echo "ALIGNMENT_CACHE_HIT=false" >> "${GITHUB_ENV}"
            echo "ALIGNMENT_CACHE_MISS_BUILT"
          fi

      - name: Save alignment and caption cache
        if: env.ALIGNMENT_CACHE_HIT != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/.cache/alignment
          key: because-of-this-alignment-${{ steps.fingerprint.outputs.alignment_key }}-${{ steps.fingerprint.outputs.caption_key }}

      - name: Restore deterministic suspense music cache
        id: music_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/.cache/music
          key: because-of-this-music-${{ steps.fingerprint.outputs.music_key }}

      - name: Build or reuse deterministic suspense soundtrack
        run: |
          set -euo pipefail
          mkdir -p episodes/video-004/audio episodes/video-004/.cache/music
          if [ -f episodes/video-004/.cache/music/music.wav ]; then
            cp episodes/video-004/.cache/music/music.wav episodes/video-004/audio/music.wav
            echo "MUSIC_CACHE_HIT=true" >> "${GITHUB_ENV}"
            echo "MUSIC_REUSE_HIT"
          else
            PYTHONPATH=. python production/generate_suspense_bed.py \
              --output episodes/video-004/audio/music.wav \
              --duration 70 \
              --sample-rate 48000
            cp episodes/video-004/audio/music.wav episodes/video-004/.cache/music/music.wav
            echo "MUSIC_CACHE_HIT=false" >> "${GITHUB_ENV}"
            echo "MUSIC_CACHE_MISS_BUILT"
          fi

      - name: Save deterministic music cache
        if: env.MUSIC_CACHE_HIT != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/.cache/music
          key: because-of-this-music-${{ steps.fingerprint.outputs.music_key }}

      - name: Hydrate preview-only Drive assets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/google_drive_assets.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" --require-drive-assets

      - name: Save verified Drive asset cache
        if: steps.asset_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/assets
          key: because-of-this-assets-${{ steps.fingerprint.outputs.asset_key }}

      - name: Enforce global no-repeat clip policy
        env:
          MANIFEST: ${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/asset_reuse_brain.py \
            --manifest "${MANIFEST}" \
            --repo-root . \
            --registry episodes/asset-memory-registry.json \
            --report episodes/video-004/rendered/asset-reuse-brain-final.json

      - name: Run visual-story QA in final mode
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/visual_story_qa.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" \
            --mode final \
            --report "episodes/video-004/rendered/visual-story-qa-final.json"

      - name: Restore rendered scene cache
        id: scene_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/.cache/scenes
          key: because-of-this-scenes-${{ steps.fingerprint.outputs.scene_key }}
          restore-keys: |
            because-of-this-scenes-

      - name: Render draft preview using cached scenes and fast review profile
        env:
          BECAUSE_OF_THIS_RENDER_PROFILE: final
          BECAUSE_OF_THIS_SCENE_CACHE_DIR: episodes/video-004/.cache/scenes
        run: |
          set -euo pipefail
          mkdir -p episodes/video-004/.cache/scenes
          PYTHONPATH=. python production/render_video_episode.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" --mode final

      - name: Save rendered scene cache
        if: steps.scene_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/.cache/scenes
          key: because-of-this-scenes-${{ steps.fingerprint.outputs.scene_key }}

      - name: Validate media and locked layout
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/caption_quality.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" \
            --report "episodes/video-004/rendered/caption-quality-final.json"
          PYTHONPATH=. python production/validate_video_release.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" \
            --mode final \
            --report "episodes/video-004/rendered/video-release-final.json"
          PYTHONPATH=. python production/golden_frame_regression.py \
            --manifest "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" \
            --mode final \
            --report "episodes/video-004/rendered/golden-layout-final.json"

      - name: Register preview artifacts and evaluate V7 gates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANIFEST: ${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}
        run: |
          set -euo pipefail
          python - "${MANIFEST}" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          path = Path(sys.argv[1]).resolve()
          value = json.loads(path.read_text(encoding="utf-8"))
          root = path.parent.resolve()
          approval_path = root / "rendered" / "final-approval.json"
          approval_path.write_text(
              json.dumps({
                  "status": "PASS",
                  "reviewer": (value.get("human_approval") or {}).get("reviewer"),
                  "approved_at": (value.get("human_approval") or {}).get("approved_at"),
                  "scope": "approved preview promoted without creative changes",
                  "video_id": value.get("video_id"),
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          runtime = {
              "narration_coverage": "rendered/narration-coverage.json",
              "final_audio": "audio/narration.wav",
              "captions": "captions/narration.ass",
              "alignment": "captions/narration.alignment.json",
              "preview": f"rendered/{value['video_id']}-final.mp4",
              "preview_approval": "rendered/final-approval.json",
              "render": f"rendered/{value['video_id']}-final.mp4",
              "technical_qa": "rendered/video-release-final.json",
              "asset_reuse": "rendered/asset-reuse-brain-final.json",
              "music": "audio/music.wav",
          }
          hashes = {}
          for key, relative in runtime.items():
              candidate = (root / relative).resolve()
              if root not in candidate.parents or not candidate.is_file():
                  raise SystemExit(f"missing or escaping artifact: {relative}")
              hashes[key] = hashlib.sha256(candidate.read_bytes()).hexdigest()
          value["runtime_artifacts"] = runtime
          value["runtime_artifact_hashes"] = hashes
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          PYTHONPATH=. python production/v7_orchestrator.py \
            --repo-root . \
            --manifest "${MANIFEST}" \
            --mode production \
            --check-gemini-tts \
            --report "episodes/video-004/rendered/v7-release-final.json"

      - name: Deliver verified preview bundle to Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/google_drive_delivery.py \
            --collection "PREVIEWS V7" \
            --delivery-name "episode-004-final-${{ steps.fingerprint.outputs.final_key }}" \
            --job-id "final-${{ steps.fingerprint.outputs.final_key }}" \
            --path "episodes/video-004/rendered" \
            --path "episodes/video-004/audio/narration.wav" \
            --path "episodes/video-004/audio/music.wav" \
            --path "episodes/video-004/captions" \
            --path "${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}" \
            --receipt "${RUNNER_TEMP}/final-drive-delivery.json"

      - name: Register reuse-first verified receipt
        env:
          MANIFEST: ${{ inputs.manifest || 'episodes/video-004/preview-manifest.json' }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/reuse_first.py write-receipt \
            --manifest "${MANIFEST}" \
            --fingerprints "${RUNNER_TEMP}/reuse-fingerprints.json" \
            --receipt "episodes/video-004/.cache/final/receipt.json" \
            --delivery-receipt "${RUNNER_TEMP}/final-drive-delivery.json"

      - name: Save verified final reuse receipt
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: episodes/video-004/.cache/final
          key: because-of-this-final-${{ steps.fingerprint.outputs.final_key }}

      - name: Print approval handoff
        run: |
          echo "FINAL_RELEASE_COMPLETE"
          echo "Final release approved and delivered; no external publication was recorded."
