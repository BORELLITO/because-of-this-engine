name: V7.2 isolated free preview experiment

on:
  push:
    branches: [experiment/v7.2-free-integrations]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: because-of-this-draft-preview-episodes/video-001/preview-manifest.json
  cancel-in-progress: false

env:
  BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"
  PYTHONUNBUFFERED: "1"

jobs:
  draft-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected preview branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate preview manifest scope
        env:
          MANIFEST: episodes/video-001/preview-manifest.json
        run: |
          set -euo pipefail
          test "${MANIFEST}" = "episodes/video-001/preview-manifest.json"
          test -f "${MANIFEST}"
          python - "${MANIFEST}" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value.get("lifecycle_status") != "DRAFT_PREVIEW_ONLY":
              raise SystemExit("preview manifest must remain DRAFT_PREVIEW_ONLY")
          if value.get("human_approval_required") is not True:
              raise SystemExit("preview manifest must retain human approval requirement")
          print("DRAFT_PREVIEW_SCOPE_PASS")
          PY

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Validate canonical V7.1 contract
        run: |
          PYTHONPATH=. python production/v7_contract.py \
            --repo-root . --manifest "episodes/video-001/preview-manifest.json" --require-production


      - name: V7.2 free metadata shot review (not a footage approval)
        run: |
          PYTHONPATH=. python experimental/v72/shot_review.py \
            --manifest episodes/video-001/preview-manifest.json \
            --report episodes/video-001/v72-shot-review.json

      - name: V7.2 tests and V7.1 non-regression
        run: |
          PYTHONPATH=. python -m unittest tests.test_v72_free_integrations -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v7*.py' -v
          PYTHONPATH=. python production/v7_singleton_guard.py --repo-root .

      - name: Preflight Drive media before any billable Cloud TTS request
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/google_drive_assets.py \
            --manifest episodes/video-001/preview-manifest.json --require-drive-assets

      - name: Cloud TTS preflight and narration
        env:
          GOOGLE_TTS_PROJECT_ID: ${{ vars.GOOGLE_TTS_PROJECT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_TTS_PROJECT_ID}"
          test -n "${GOOGLE_CLIENT_ID}"
          test -n "${GOOGLE_CLIENT_SECRET}"
          test -n "${GOOGLE_REFRESH_TOKEN}"
          PYTHONPATH=. python production/cloud_tts.py --manifest "episodes/video-001/preview-manifest.json" --preflight
          PYTHONPATH=. python production/cloud_tts.py \
            --manifest "episodes/video-001/preview-manifest.json" \
            --input "episodes/video-001/script.txt" \
            --output-dir "episodes/video-001/audio"

      - name: Install independent Vosk alignment models
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/vosk" "${RUNNER_TEMP}/vosk-secondary"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://alphacephei.com/vosk/models/vosk-model-en-us-0.22-lgraph.zip" \
            --output "${RUNNER_TEMP}/vosk/model.zip"
          unzip -q "${RUNNER_TEMP}/vosk/model.zip" -d "${RUNNER_TEMP}/vosk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            --output "${RUNNER_TEMP}/vosk-secondary/model.zip"
          unzip -q "${RUNNER_TEMP}/vosk-secondary/model.zip" -d "${RUNNER_TEMP}/vosk-secondary"
          echo "VOSK_MODEL_DIR=${RUNNER_TEMP}/vosk/vosk-model-en-us-0.22-lgraph" >> "${GITHUB_ENV}"
          echo "VOSK_SECONDARY_MODEL_DIR=${RUNNER_TEMP}/vosk-secondary/vosk-model-small-en-us-0.15" >> "${GITHUB_ENV}"

      - name: Build forced-alignment captions and story coverage
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/align_captions.py \
            --manifest "episodes/video-001/preview-manifest.json" \
            --model-dir "${VOSK_MODEL_DIR}" \
            --secondary-model-dir "${VOSK_SECONDARY_MODEL_DIR}"
          PYTHONPATH=. python production/story_intelligence.py \
            --manifest "episodes/video-001/preview-manifest.json" \
            --alignment "episodes/video-001/captions/narration.alignment.json" \
            --report "episodes/video-001/rendered/narration-coverage.json"

      - name: Revalidate hydrated preview-only Drive assets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/google_drive_assets.py \
            --manifest "episodes/video-001/preview-manifest.json" --require-drive-assets

      - name: Run visual-story QA in draft-preview mode
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/visual_story_qa.py \
            --manifest "episodes/video-001/preview-manifest.json" \
            --mode draft-preview \
            --report "episodes/video-001/rendered/visual-story-qa-draft-preview.json"

      - name: Render complete draft preview
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/render_video_episode.py \
            --manifest "episodes/video-001/preview-manifest.json" --mode draft-preview

      - name: Validate media and locked layout
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/caption_quality.py \
            --manifest "episodes/video-001/preview-manifest.json" \
            --report "episodes/video-001/rendered/caption-quality-draft-preview.json"
          PYTHONPATH=. python production/validate_video_release.py \
            --manifest "episodes/video-001/preview-manifest.json" --mode draft-preview \
            --report "episodes/video-001/rendered/video-release-draft-preview.json"
          PYTHONPATH=. python production/golden_frame_regression.py \
            --manifest "episodes/video-001/preview-manifest.json" --mode draft-preview \
            --report "episodes/video-001/rendered/golden-layout-draft-preview.json"

      - name: Register preview artifacts and evaluate V7 gates
        env:
          MANIFEST: episodes/video-001/preview-manifest.json
          GOOGLE_TTS_PROJECT_ID: ${{ vars.GOOGLE_TTS_PROJECT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python - "${MANIFEST}" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          root = path.parent
          runtime = {
              "narration_coverage": "rendered/narration-coverage.json",
              "final_audio": "audio/narration.wav",
              "captions": "captions/narration.ass",
              "alignment": "captions/narration.alignment.json",
              "preview": f"rendered/{value['video_id']}-draft-preview.mp4",
              "render": f"rendered/{value['video_id']}-draft-preview.mp4",
              "technical_qa": "rendered/video-release-draft-preview.json",
          }
          hashes = {}
          for key, relative in runtime.items():
              candidate = (root / relative).resolve()
              if root not in candidate.parents or not candidate.is_file():
                  raise SystemExit(f"missing or escaping artifact: {relative}")
              hashes[key] = hashlib.sha256(candidate.read_bytes()).hexdigest()
          value["runtime_artifacts"] = runtime
          value["runtime_artifact_hashes"] = hashes
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          PYTHONPATH=. python production/v7_orchestrator.py \
            --repo-root . --manifest "${MANIFEST}" --mode draft-preview \
            --check-cloud-tts \
            --report "episodes/video-001/rendered/v7-release-draft-preview.json"

      - name: Deliver verified preview bundle to Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python production/google_drive_delivery.py \
            --collection "PREVIEWS V7" \
            --delivery-name "episode-001-draft-preview-${{ github.run_id }}" \
            --job-id "draft-preview-${{ github.run_id }}" \
            --path "episodes/video-001/rendered" \
            --path "episodes/video-001/audio/narration.wav" \
            --path "episodes/video-001/preview-manifest.json" \
            --receipt "${RUNNER_TEMP}/draft-preview-drive-delivery.json"

      - name: Print approval handoff
        run: |
          echo "DRAFT_PREVIEW_COMPLETE"
          echo "No production approval or publication was recorded."
