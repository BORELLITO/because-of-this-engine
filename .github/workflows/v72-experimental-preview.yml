name: V7.2 free add-ons validation ONLY (no TTS or render)

on:
  push:
    branches: [experiment/v7.2-free-integrations]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v72-free-static-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  free-addon-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated experimental branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile experimental modules (standard library only)
        run: python -m py_compile experimental/v72/*.py
      - name: Run free integration safety tests
        run: PYTHONPATH=. python -m unittest tests.test_v72_free_integrations -v
      - name: Shot metadata audit (NEVER approves images or release)
        run: |
          PYTHONPATH=. python experimental/v72/shot_review.py \
            --manifest episodes/video-001/preview-manifest.json \
            --report "${RUNNER_TEMP}/v72-shot-review.json"
      - name: Mark this job as validation only
        run: |
          echo "NO_TTS_CALLED"
          echo "NO_RENDER_ATTEMPTED"
          echo "NO_PUBLICATION_AND_NO_MAIN_BRANCH_MODIFICATION"
