name: One-off deep GitHub hygiene

on:
  push:
    paths:
      - ".github/workflows/one-off-deep-github-hygiene.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit and conservative cleanup
        uses: actions/github-script@v7
        env:
          REPORT_PATH: deep_github_hygiene_report.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const now = Date.now();
            const DAY = 24 * 60 * 60 * 1000;
            const protectedArtifactName = /(release|backup|permanent|keep)/i;

            const repository = (await github.rest.repos.get({ owner, repo })).data;
            const defaultBranch = repository.default_branch;

            // 1) Artifacts: only delete expired or old artifacts from successful completed runs.
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const deletedArtifacts = [];
            const keptArtifacts = [];
            const runCache = new Map();

            for (const a of artifacts) {
              const age = now - new Date(a.created_at).getTime();
              const base = {
                id: a.id, name: a.name, size_in_bytes: a.size_in_bytes || 0,
                created_at: a.created_at, expired: Boolean(a.expired),
                workflow_run_id: a.workflow_run?.id || null
              };

              if (protectedArtifactName.test(a.name || '')) {
                keptArtifacts.push({ ...base, reason: 'protected-name' });
                continue;
              }

              let deleteIt = Boolean(a.expired);
              let reason = a.expired ? 'expired' : '';
              const runId = a.workflow_run?.id || null;
              let run = null;

              if (!deleteIt && runId && age > DAY) {
                if (!runCache.has(runId)) {
                  try {
                    runCache.set(runId, (await github.rest.actions.getWorkflowRun({
                      owner, repo, run_id: runId
                    })).data);
                  } catch (e) {
                    runCache.set(runId, { lookup_error: e.status || e.message });
                  }
                }
                run = runCache.get(runId);
                if (run?.status === 'completed' && run?.conclusion === 'success') {
                  deleteIt = true;
                  reason = 'successful-run-older-than-1d';
                }
              }

              if (deleteIt) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                  deletedArtifacts.push({ ...base, reason });
                } catch (e) {
                  keptArtifacts.push({ ...base, reason: `delete-failed:${e.status || e.message}` });
                }
              } else {
                keptArtifacts.push({ ...base, reason: 'not-proven-safe' });
              }
            }

            // 2) Workflow runs/log history.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );
            const deletedRuns = [];
            const keptRuns = [];

            const runRetentionDays = (conclusion) => {
              if (['cancelled', 'skipped', 'neutral'].includes(conclusion)) return 7;
              if (conclusion === 'success') return 14;
              if (['failure', 'timed_out', 'action_required', 'startup_failure'].includes(conclusion)) return 30;
              return Infinity;
            };

            for (const run of runs) {
              const base = {
                id: run.id,
                name: run.name,
                workflow_id: run.workflow_id,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
                created_at: run.created_at,
                updated_at: run.updated_at,
                head_branch: run.head_branch
              };

              if (run.id === context.runId || run.status !== 'completed') {
                keptRuns.push({ ...base, reason: run.id === context.runId ? 'current-run' : 'not-completed' });
                continue;
              }

              const days = (now - new Date(run.created_at).getTime()) / DAY;
              const retain = runRetentionDays(run.conclusion);
              if (days > retain) {
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                  deletedRuns.push({ ...base, age_days: Number(days.toFixed(1)), retention_days: retain });
                } catch (e) {
                  keptRuns.push({ ...base, reason: `delete-failed:${e.status || e.message}` });
                }
              } else {
                keptRuns.push({ ...base, reason: `within-${retain}d-retention` });
              }
            }

            // 3) Caches: delete only caches unused for >14 days.
            let caches = [];
            let deletedCaches = [];
            let keptCaches = [];
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                owner, repo, per_page: 100
              });
              caches = response.data.actions_caches || [];
              for (const c of caches) {
                const last = c.last_accessed_at || c.created_at;
                const days = (now - new Date(last).getTime()) / DAY;
                const base = {
                  id: c.id, key: c.key, ref: c.ref,
                  size_in_bytes: c.size_in_bytes || 0,
                  created_at: c.created_at,
                  last_accessed_at: c.last_accessed_at
                };
                if (days > 14) {
                  try {
                    await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
                      owner, repo, cache_id: c.id
                    });
                    deletedCaches.push({ ...base, unused_days: Number(days.toFixed(1)) });
                  } catch (e) {
                    keptCaches.push({ ...base, reason: `delete-failed:${e.status || e.message}` });
                  }
                } else {
                  keptCaches.push({ ...base, reason: 'accessed-within-14d' });
                }
              }
            } catch (e) {
              keptCaches.push({ reason: `cache-audit-failed:${e.status || e.message}` });
            }

            // 4) Branches: delete only unprotected, fully merged branches older than 30 days.
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const deletedBranches = [];
            const keptBranches = [];

            for (const branch of branches) {
              if (branch.name === defaultBranch) {
                keptBranches.push({ name: branch.name, reason: 'default-branch' });
                continue;
              }
              if (branch.protected) {
                keptBranches.push({ name: branch.name, reason: 'protected' });
                continue;
              }

              try {
                const commit = (await github.rest.repos.getCommit({
                  owner, repo, ref: branch.commit.sha
                })).data;
                const committedAt = commit.commit?.committer?.date || commit.commit?.author?.date;
                const ageDays = committedAt ? (now - new Date(committedAt).getTime()) / DAY : 0;

                const cmp = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                  owner, repo, basehead: `${defaultBranch}...${branch.name}`
                });
                const aheadBy = cmp.data.ahead_by ?? null;
                const behindBy = cmp.data.behind_by ?? null;

                if (aheadBy === 0 && ageDays > 30) {
                  await github.rest.git.deleteRef({
                    owner, repo, ref: `heads/${branch.name}`
                  });
                  deletedBranches.push({
                    name: branch.name, commit_sha: branch.commit.sha,
                    last_commit_at: committedAt, age_days: Number(ageDays.toFixed(1)),
                    ahead_by: aheadBy, behind_by: behindBy
                  });
                } else {
                  keptBranches.push({
                    name: branch.name, protected: false,
                    last_commit_at: committedAt,
                    age_days: Number(ageDays.toFixed(1)),
                    ahead_by: aheadBy, behind_by: behindBy,
                    reason: aheadBy === 0 ? 'merged-but-not-older-than-30d' : 'has-unique-commits'
                  });
                }
              } catch (e) {
                keptBranches.push({ name: branch.name, reason: `branch-audit-failed:${e.status || e.message}` });
              }
            }

            // 5) Releases: audit only. Published releases are never auto-deleted.
            let releases = [];
            try {
              releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 100 }
              );
            } catch (e) {
              releases = [{ audit_error: e.status || e.message }];
            }
            const releaseAudit = releases.map(r => r.audit_error ? r : ({
              id: r.id, tag_name: r.tag_name, name: r.name,
              draft: r.draft, prerelease: r.prerelease,
              created_at: r.created_at, published_at: r.published_at,
              assets_count: (r.assets || []).length,
              assets_bytes: (r.assets || []).reduce((s, a) => s + (a.size || 0), 0)
            }));

            // 6) Workflows: audit active/disabled workflows.
            let workflows = [];
            try {
              workflows = await github.paginate(
                github.rest.actions.listRepoWorkflows,
                { owner, repo, per_page: 100 }
              );
            } catch (e) {
              workflows = [{ audit_error: e.status || e.message }];
            }
            const workflowAudit = workflows.map(w => w.audit_error ? w : ({
              id: w.id, name: w.name, path: w.path, state: w.state,
              created_at: w.created_at, updated_at: w.updated_at
            }));

            // 7) Repository tree: flag large/versioned generated-looking blobs; do not delete automatically.
            let largeFiles = [];
            try {
              const ref = (await github.rest.git.getRef({
                owner, repo, ref: `heads/${defaultBranch}`
              })).data;
              const tree = (await github.rest.git.getTree({
                owner, repo, tree_sha: ref.object.sha, recursive: 'true'
              })).data.tree || [];
              const generatedExt = /\.(mp4|mov|mkv|avi|wav|mp3|zip|7z|tar|gz|bin|onnx|pt|pth)$/i;
              largeFiles = tree
                .filter(x => x.type === 'blob' && ((x.size || 0) >= 5 * 1024 * 1024 || generatedExt.test(x.path || '')))
                .map(x => ({ path: x.path, size_in_bytes: x.size || 0, sha: x.sha }))
                .sort((a,b) => b.size_in_bytes - a.size_in_bytes);
            } catch (e) {
              largeFiles = [{ audit_error: e.status || e.message }];
            }

            // Re-enumerate storage after cleanup.
            const artifactsAfter = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            let cachesAfter = [];
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                owner, repo, per_page: 100
              });
              cachesAfter = response.data.actions_caches || [];
            } catch {}

            const sum = (items, field) => items.reduce((s, x) => s + (x[field] || 0), 0);
            const report = {
              generated_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              default_branch: defaultBranch,
              repository_size_kb: repository.size,
              cleanup_policy: {
                artifacts: 'expired or successful-run artifacts older than 1 day; protected names kept',
                workflow_runs: 'cancelled/skipped/neutral >7d; success >14d; failures >30d',
                caches: 'unused >14d',
                branches: 'unprotected + fully merged + last commit >30d',
                releases: 'audit only',
                large_versioned_files: 'audit only'
              },
              artifacts: {
                before_count: artifacts.length,
                before_bytes: sum(artifacts, 'size_in_bytes'),
                deleted_count: deletedArtifacts.length,
                deleted_bytes: sum(deletedArtifacts, 'size_in_bytes'),
                after_count: artifactsAfter.length,
                after_bytes: sum(artifactsAfter, 'size_in_bytes'),
                deleted: deletedArtifacts,
                kept: keptArtifacts
              },
              workflow_runs: {
                before_count: runs.length,
                deleted_count: deletedRuns.length,
                deleted: deletedRuns,
                kept_count: keptRuns.length
              },
              caches: {
                before_count: caches.length,
                before_bytes: sum(caches, 'size_in_bytes'),
                deleted_count: deletedCaches.length,
                deleted_bytes: sum(deletedCaches, 'size_in_bytes'),
                after_count: cachesAfter.length,
                after_bytes: sum(cachesAfter, 'size_in_bytes'),
                deleted: deletedCaches,
                kept: keptCaches
              },
              branches: {
                before_count: branches.length,
                deleted_count: deletedBranches.length,
                deleted: deletedBranches,
                kept: keptBranches
              },
              releases: releaseAudit,
              workflows: workflowAudit,
              large_versioned_files: largeFiles
            };

            fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify(report, null, 2) + '\n');
            core.summary
              .addHeading('Deep GitHub hygiene')
              .addRaw(`Deleted workflow runs: ${deletedRuns.length}\n`)
              .addRaw(`Deleted stale caches: ${deletedCaches.length} (${sum(deletedCaches, 'size_in_bytes')} bytes)\n`)
              .addRaw(`Deleted safe merged branches: ${deletedBranches.length}\n`)
              .addRaw(`Artifacts remaining: ${artifactsAfter.length}\n`)
              .addRaw(`Large versioned files flagged: ${largeFiles.length}\n`);
            await core.summary.write();

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deep_github_hygiene_report.json
          git commit -m "chore: add deep GitHub hygiene report" || exit 0
          git push
