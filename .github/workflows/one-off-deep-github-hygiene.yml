name: One-off prune redundant Actions runs

on:
  push:
    paths:
      - ".github/workflows/one-off-deep-github-hygiene.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep only useful run history
        uses: actions/github-script@v7
        env:
          REPORT_PATH: redundant_run_cleanup_report.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const buckets = new Map();
            const classify = (run) => {
              if (run.conclusion === 'success') return 'success';
              if (['failure','timed_out','action_required','startup_failure'].includes(run.conclusion)) return 'failure';
              if (['cancelled','skipped','neutral'].includes(run.conclusion)) return 'cancelled';
              return 'other';
            };
            const keepLimit = { success: 20, failure: 20, cancelled: 5, other: 20 };

            for (const run of runs) {
              if (run.status !== 'completed') continue;
              const cls = classify(run);
              const key = `${run.workflow_id}:${cls}`;
              if (!buckets.has(key)) buckets.set(key, []);
              buckets.get(key).push(run);
            }

            const deleted = [];
            const kept = [];
            for (const [key, group] of buckets.entries()) {
              group.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
              const cls = key.split(':').pop();
              const limit = keepLimit[cls] ?? 20;

              for (let i = 0; i < group.length; i++) {
                const run = group[i];
                const item = {
                  id: run.id,
                  workflow_id: run.workflow_id,
                  name: run.name,
                  conclusion: run.conclusion,
                  created_at: run.created_at,
                  head_branch: run.head_branch
                };

                if (run.id === context.runId || i < limit) {
                  kept.push({ ...item, reason: run.id === context.runId ? 'current-run' : `latest-${limit}-${cls}` });
                  continue;
                }

                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner, repo, run_id: run.id
                  });
                  deleted.push(item);
                } catch (e) {
                  kept.push({ ...item, reason: `delete-failed:${e.status || e.message}` });
                }
              }
            }

            const remaining = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const report = {
              generated_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              policy: {
                success_per_workflow: 20,
                failure_per_workflow: 20,
                cancelled_skipped_neutral_per_workflow: 5,
                in_progress_and_queued: 'always preserved'
              },
              before_count: runs.length,
              deleted_count: deleted.length,
              after_count: remaining.length,
              deleted_by_name: deleted.reduce((acc, x) => {
                acc[x.name] = (acc[x.name] || 0) + 1;
                return acc;
              }, {}),
              deleted: deleted
            };

            fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify(report, null, 2) + '\n');
            core.summary
              .addHeading('Redundant Actions run cleanup')
              .addRaw(`Before: ${runs.length}\n`)
              .addRaw(`Deleted: ${deleted.length}\n`)
              .addRaw(`After: ${remaining.length}\n`);
            await core.summary.write();

      - name: Commit cleanup report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redundant_run_cleanup_report.json
          git commit -m "chore: record Actions run cleanup" || exit 0
          git push
