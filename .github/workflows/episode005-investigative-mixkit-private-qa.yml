name: BECAUSE OF THIS V2.1 EP005 Investigative Mixkit Music QA ($0)

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/episode005-investigative-mixkit-private-qa.yml", "production/mixkit_ep005_investigation_qa.py"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  investigative-music-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout canonical engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Probe exact Mixkit provider HTML source IDs — free/read-only
        run: |
          python3 - <<'PY'
          import urllib.request,re,hashlib
          url="https://mixkit.co/free-stock-music/drone-music/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; BOT-Music-Source-Audit/1.0)"})
          body=urllib.request.urlopen(req,timeout=28).read()
          assert 4000<len(body)<5000000,len(body)
          s=body.decode("utf-8",errors="replace")
          print("SOURCE_HTML_SHA256",hashlib.sha256(body).hexdigest(),"SIZE",len(body))
          for title in ("Selpan","Delirium"):
            matches=list(re.finditer(r"(?i)"+re.escape(title),s))
            print("TITLE",title,"COUNT",len(matches))
            for m in matches[:3]:
              text=s[max(0,m.start()-220):min(len(s),m.end()+950)]
              text=re.sub(r"\s+"," ",text)
              print("SNIPPET",text[:1100])
          print("MUSIC_CDN_MENTIONS",len(re.findall(r"assets\.mixkit\.co/music",s)))
          print("EXACT_AUDIO_LINKS",re.findall(r"https://assets\.mixkit\.co/music/\d+/\d+\.mp3",s)[:18])
          PY
