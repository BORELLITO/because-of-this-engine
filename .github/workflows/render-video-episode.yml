name: Render video-only episode v2

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "v2 episode manifest path"
        required: true
        type: string
      mode:
        description: "Render size"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - final
      confirm_cleanup:
        description: "Human confirmation to delete runner-local ephemeral media after verified Drive delivery"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: because-of-this-v2-${{ inputs.manifest }}-${{ inputs.mode }}
  cancel-in-progress: false

# Single workflow-level destination for all preflight, delivery and receipt steps.
# The Python adapter keeps the same value only as a local-development fallback.
env:
  BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require latest main revision at checkout
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Only the current main branch may run the Because Of This production engine."
            exit 1
          fi
          CURRENT_MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ -z "${CURRENT_MAIN_SHA}" ] || [ "${CURRENT_MAIN_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::Stale workflow revision blocked. Dispatched ${GITHUB_SHA}; current main ${CURRENT_MAIN_SHA}."
            exit 1
          fi
          echo "LATEST_MAIN_REVISION_PASS=${GITHUB_SHA}"

      - name: Validate v2 manifest scope
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python - "${MANIFEST}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          manifest = sys.argv[1]
          if not re.fullmatch(r"episodes/[^/]+/manifest\.json", manifest):
              raise SystemExit("Manifest must be exactly inside episodes/<episode>/manifest.json.")
          manifest_path = Path(manifest)
          if not manifest_path.is_file():
              raise SystemExit(f"Manifest does not exist: {manifest}")
          value = json.loads(manifest_path.read_text(encoding="utf-8"))
          if value.get("lifecycle_status") == "ARCHIVED_HISTORICAL":
              raise SystemExit("Historical archived manifests cannot enter the production workflow.")
          print(f"V2_MANIFEST_SCOPE_PASS: {manifest}")
          PY

      - name: Enforce canonical engine profile
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python production/canonical_config.py --manifest "${MANIFEST}"

      - name: Enforce single active engine policy
        run: PYTHONPATH=. python production/engine_singleton_guard.py --repo-root .
      - name: Enforce master prompt V6 contract
        run: |
          set -euo pipefail
          python production/master_prompt_contract.py --repo-root . \
            --manifest "${{ inputs.manifest }}"

      - name: Validate episode against current visual contract
        env:
          MANIFEST: ${{ inputs.manifest }}
          RENDER_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python production/manifest_readiness.py \
            --manifest "${MANIFEST}" \
            --mode "${RENDER_MODE}" \
            --report "$(dirname "${MANIFEST}")/rendered/readiness-${RENDER_MODE}.json"

      - name: Install static FFmpeg with retries
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ffmpeg"
          FFMPEG_URL="https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 240 "${FFMPEG_URL}" \
            --output "${RUNNER_TEMP}/ffmpeg-release-amd64-static.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 60 "${FFMPEG_URL}.md5" \
            --output "${RUNNER_TEMP}/ffmpeg-release-amd64-static.tar.xz.md5"
          (cd "${RUNNER_TEMP}" && md5sum -c ffmpeg-release-amd64-static.tar.xz.md5)
          tar -xJf "${RUNNER_TEMP}/ffmpeg-release-amd64-static.tar.xz" -C "${RUNNER_TEMP}/ffmpeg"
          FFMPEG_DIR="$(find "${RUNNER_TEMP}/ffmpeg" -maxdepth 1 -mindepth 1 -type d -name 'ffmpeg-*static' -print -quit)"
          test -n "${FFMPEG_DIR}"
          echo "${FFMPEG_DIR}" >> "${GITHUB_PATH}"
          "${FFMPEG_DIR}/ffmpeg" -version | head -n 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Initialize stable job state
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python production/pipeline_state.py --manifest "${MANIFEST}" --initialize
          JOB_ID="$(python - "${MANIFEST}" <<'PY'
          import sys
          import json
          from pathlib import Path
          from production.pipeline_state import job_id_from_manifest
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(job_id_from_manifest(value))
          PY
          )"
          echo "JOB_ID=${JOB_ID}" >> "${GITHUB_ENV}"

      - name: Mark research stage
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition RESEARCHED --stage research

      - name: Mark script approval stage
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition SCRIPT_APPROVED --stage script

      - name: Run pre-render story creation intelligence
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          python production/story_creation.py \
            --manifest "${{ inputs.manifest }}" \
            --report "${EPISODE_DIR}/rendered/story-creation-${{ inputs.mode }}.json"

      - name: Run global no-repeat asset brain
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          test -s "episodes/asset-memory-registry.json"
          python production/asset_reuse_brain.py \
            --manifest "${{ inputs.manifest }}" \
            --repo-root "." \
            --registry "episodes/asset-memory-registry.json" \
            --report "${EPISODE_DIR}/rendered/asset-reuse-brain-${{ inputs.mode }}.json"

      - name: Run engine regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Google Drive delivery destination
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python production/google_drive_delivery.py --preflight

      - name: Hydrate approved video assets from Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python production/google_drive_assets.py --manifest "${{ inputs.manifest }}" --require-drive-assets

      - name: Run visual asset preflight and build contact sheet
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          python production/asset_preflight.py \
            --manifest "${{ inputs.manifest }}" \
            --report "${EPISODE_DIR}/rendered/visual-preflight-${{ inputs.mode }}.json" \
            --contact-sheet "${EPISODE_DIR}/rendered/visual-contact-sheet-${{ inputs.mode }}.jpg"

      - name: Restore verified narration cache
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          python production/narration_cache.py \
            --manifest "${{ inputs.manifest }}" \
            --restore \
            --status-file "${RUNNER_TEMP}/narration-cache.json"
          CACHE_STATUS="$(python - "${RUNNER_TEMP}/narration-cache.json" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", "NARRATION_CACHE_MISS"))
          PY
          )"
          if [ "${CACHE_STATUS}" = "NARRATION_CACHE_HIT" ]; then
            echo "NARRATION_CACHE_HIT=true" >> "${GITHUB_ENV}"
            echo "TTS_QUOTA_PREFLIGHT=NARRATION_CACHE_HIT" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "NARRATION_CACHE_HIT=false" >> "${GITHUB_ENV}"
            echo "TTS_QUOTA_PREFLIGHT=NARRATION_CACHE_MISS" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Run strict visual story semantic gate
        run: |
          set -euo pipefail
          python production/visual_story_qa.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/visual-story-qa-${{ inputs.mode }}.json"

      - name: Generate narration with Google Gemini TTS (documented REST)
        if: env.NARRATION_CACHE_HIT != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_TIMEOUT_SECONDS: "180"
          GEMINI_TTS_TRANSPORT: "rest_unary"
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          MODEL="$(python - "${EPISODE_DIR}/manifest.json" <<'PY'
          import json
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          print(value["voice"]["model"])
          PY
          )"
          VOICE="$(python - "${EPISODE_DIR}/manifest.json" <<'PY'
          import json
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          print(value["voice"]["voice"])
          PY
          )"
          STYLE="$(python - "${EPISODE_DIR}/manifest.json" <<'PY'
          import json
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          print(value["voice"]["style"])
          PY
          )"
          NARRATION_INPUT="$(python - "${EPISODE_DIR}/manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          manifest_path = Path(sys.argv[1]).resolve()
          value = json.loads(manifest_path.read_text(encoding="utf-8"))
          configured = (value.get("voice") or {}).get("tts_script_path")
          path = (manifest_path.parent / configured).resolve() if configured else (manifest_path.parent / "script.txt").resolve()
          if path == manifest_path.parent or manifest_path.parent not in path.parents:
              raise SystemExit("TTS pronunciation script must stay inside the episode directory.")
          print(path)
          PY
          )"
          python narrate.py \
            --input "${NARRATION_INPUT}" \
            --output "${EPISODE_DIR}/audio/narration.wav" \
            --model "${MODEL}" \
            --voice "${VOICE}" \
            --style "${STYLE}" \
            --overwrite

      - name: Normalize narration duration into Shorts contract
        run: |
          set -euo pipefail
          python production/normalize_narration_duration.py \
            --manifest "${{ inputs.manifest }}" \
            --ffmpeg ffmpeg

      - name: Annotate and persist verified narration cache
        if: env.NARRATION_CACHE_HIT != 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python production/narration_cache.py --manifest "${{ inputs.manifest }}" --annotate
          python production/narration_cache.py --manifest "${{ inputs.manifest }}" --store

      - name: Mark voice stage
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition VOICE_READY --stage voice

      - name: Install Vosk independent forced-alignment models
        run: |
          set -euo pipefail
          MODEL_ROOT="${RUNNER_TEMP}/vosk"
          SECONDARY_MODEL_ROOT="${RUNNER_TEMP}/vosk-secondary"
          mkdir -p "${MODEL_ROOT}" "${SECONDARY_MODEL_ROOT}"

          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            "https://alphacephei.com/vosk/models/vosk-model-en-us-0.22-lgraph.zip" \
            --output "${MODEL_ROOT}/model.zip"
          echo "d9838b4aaa82a75c4a17f5aca300eaca129aaab2a7cbf951bafbb500eb9c4334  ${MODEL_ROOT}/model.zip" | sha256sum -c -
          unzip -q "${MODEL_ROOT}/model.zip" -d "${MODEL_ROOT}"
          test -d "${MODEL_ROOT}/vosk-model-en-us-0.22-lgraph"

          # Independent lightweight wideband model from the official Vosk model
          # catalog. It is used only as a second real acoustic timestamp source;
          # it never supplies estimated or interpolated timings.
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            --output "${SECONDARY_MODEL_ROOT}/model.zip"
          unzip -q "${SECONDARY_MODEL_ROOT}/model.zip" -d "${SECONDARY_MODEL_ROOT}"
          test -d "${SECONDARY_MODEL_ROOT}/vosk-model-small-en-us-0.15"

          echo "VOSK_MODEL_DIR=${MODEL_ROOT}/vosk-model-en-us-0.22-lgraph" >> "${GITHUB_ENV}"
          echo "VOSK_SECONDARY_MODEL_DIR=${SECONDARY_MODEL_ROOT}/vosk-model-small-en-us-0.15" >> "${GITHUB_ENV}"

      # generate_phrase_captions.py remains the phrase-segmentation helper; timing is now forced from the final WAV.
      - name: Mark visual plan stage
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition VISUAL_PLAN_READY --stage visual-plan

      - name: Generate forced-aligned captions from final narration
        run: |
          set -euo pipefail
          python production/align_captions.py \
            --manifest "${{ inputs.manifest }}" \
            --model-dir "${VOSK_MODEL_DIR}" \
            --secondary-model-dir "${VOSK_SECONDARY_MODEL_DIR}"

      - name: Run forced-alignment narration coverage gate
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          python production/story_intelligence.py \
            --manifest "${{ inputs.manifest }}" \
            --alignment "${EPISODE_DIR}/captions/narration.alignment.json" \
            --report "${EPISODE_DIR}/rendered/narration-coverage.json"

      - name: Mark assets approved
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition ASSETS_APPROVED --stage assets

      - name: Run strict caption QA
        run: |
          EXTRA=""
          if [ "${{ inputs.mode }}" = "final" ]; then
            EXTRA="--require-word-level"
          fi
          python production/caption_quality.py \
            --manifest "${{ inputs.manifest }}" \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/caption-quality-${{ inputs.mode }}.json" \
            ${EXTRA}
      - name: Enforce executable V6 prompt compliance before render
        run: |
          python production/prompt_compliance.py \
            --manifest "\${{ inputs.manifest }}" \
            --mode "\${{ inputs.mode }}" \
            --report "\$(dirname "\${{ inputs.manifest }}")/rendered/prompt-compliance-pre-render.json"

      - name: Evaluate canonical gates before render
        run: |
          python production/quality_gates.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --phase pre-render \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/quality-gates-pre-render.json"

      - name: Validate v2 video contract
        run: python production/render_video_episode.py --manifest "${{ inputs.manifest }}" --mode "${{ inputs.mode }}" --validate-only

      - name: Mark timeline ready
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition TIMELINE_READY --stage timeline

      - name: Recheck latest main revision before render
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Only the current main branch may run the Because Of This production engine."
            exit 1
          fi
          CURRENT_MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ -z "${CURRENT_MAIN_SHA}" ] || [ "${CURRENT_MAIN_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::Stale workflow revision blocked. Dispatched ${GITHUB_SHA}; current main ${CURRENT_MAIN_SHA}."
            exit 1
          fi
          echo "LATEST_MAIN_REVISION_PASS=${GITHUB_SHA}"

      - name: Render narration-locked episode
        run: python production/render_video_episode.py --manifest "${{ inputs.manifest }}" --mode "${{ inputs.mode }}"

      - name: Mark render complete
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition RENDERED --stage render

      - name: Validate release media, captions and reuse gates
        run: |
          python production/validate_video_release.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/video-release-${{ inputs.mode }}.json"
      - name: Run golden layout regression
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          python production/golden_frame_regression.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --report "${EPISODE_DIR}/rendered/golden-layout-${{ inputs.mode }}.json"

      - name: Enforce executable V6 prompt compliance after render
        run: |
          python production/prompt_compliance.py \
            --manifest "\${{ inputs.manifest }}" \
            --mode "\${{ inputs.mode }}" \
            --release-report "\$(dirname "\${{ inputs.manifest }}")/rendered/video-release-\${{ inputs.mode }}.json" \
            --report "\$(dirname "\${{ inputs.manifest }}")/rendered/prompt-compliance-post-render.json"

      - name: Evaluate canonical gates after render QA
        run: |
          python production/quality_gates.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --phase post-render \
            --release-report "$(dirname "${{ inputs.manifest }}")/rendered/video-release-${{ inputs.mode }}.json" \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/quality-gates-post-render.json"

      - name: Mark QA passed
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition QA_PASSED --stage qa

      - name: Publish v2 validation receipt
        if: always()
        run: |
          REPORT="$(dirname "${{ inputs.manifest }}")/rendered/video-release-${{ inputs.mode }}.json"
          {
            echo "## Because of This — v2 validation receipt"
            if [ -f "${REPORT}" ]; then
              python - "${REPORT}" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("status", "job_id", "video_id", "mode", "duration_seconds", "dimensions", "codec", "technical_qa", "caption_gate", "provenance_gate", "post_render_sync"):
              print(f"- {key}: {report.get(key)}")
          PY
            else
              echo "- status: no v2 validation receipt was produced"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Block stale revision before Drive delivery
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Only the current main branch may run the Because Of This production engine."
            exit 1
          fi
          CURRENT_MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ -z "${CURRENT_MAIN_SHA}" ] || [ "${CURRENT_MAIN_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::Stale workflow revision blocked. Dispatched ${GITHUB_SHA}; current main ${CURRENT_MAIN_SHA}."
            exit 1
          fi
          echo "LATEST_MAIN_REVISION_PASS=${GITHUB_SHA}"

      - name: Deliver validated v2 production to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python production/google_drive_delivery.py \
            --collection "VIDEOS V2" \
            --delivery-name "render-${JOB_ID}-${{ inputs.mode }}" \
            --job-id "${JOB_ID}" \
            --path "$(dirname "${{ inputs.manifest }}")/rendered" \
            --path "${{ inputs.manifest }}" \
            --receipt "${RUNNER_TEMP}/drive-delivery.json"

      - name: Mark delivery verified
        run: |
          python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition DELIVERED --stage delivery
          python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition DELIVERY_VERIFIED --stage delivery-verification

      - name: Write final reproducibility manifest
        run: |
          python production/finalize_manifest.py \
            --manifest "${{ inputs.manifest }}" \
            --release-report "$(dirname "${{ inputs.manifest }}")/rendered/video-release-${{ inputs.mode }}.json" \
            --delivery-receipt "${RUNNER_TEMP}/drive-delivery.json" \
            --mode "${{ inputs.mode }}"

      - name: Deliver final reproducibility manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
          MODE: ${{ inputs.mode }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          FINAL_MANIFEST="$(dirname "${MANIFEST}")/rendered/final-manifest-$(python - "${MANIFEST}" "${MODE}" <<'PY'
          import sys
          import json
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{value['video_id']}-{sys.argv[2]}.json")
          PY
          )"
          python production/google_drive_delivery.py \
            --collection "VIDEOS V2" \
            --delivery-name "render-${JOB_ID}-${MODE}" \
            --job-id "${JOB_ID}" \
            --path "${FINAL_MANIFEST}" \
            --receipt "${RUNNER_TEMP}/final-delivery.json"

      - name: Remove ephemeral media only after verified Drive delivery
        if: success()
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          test "\${{ inputs.confirm_cleanup }}" = "true"
          test -s "\${RUNNER_TEMP}/final-delivery.json"
          grep -q '"status": "DRIVE_VERIFIED"' "\${RUNNER_TEMP}/final-delivery.json"
          python production/cleanup_confirmation.py \
            --episode-dir "\${EPISODE_DIR}" \
            --delivery-receipt "\${RUNNER_TEMP}/final-delivery.json" \
            --confirmation "\${{ inputs.confirm_cleanup }}"
          echo "v2 media delivered and verified in Google Drive; scoped runner-local media removed." >> "${GITHUB_STEP_SUMMARY}"
          python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition CLEANED --stage cleanup

      - name: Mark final manifest complete after cleanup
        run: |
          python production/finalize_manifest.py \
            --manifest "$(dirname "${{ inputs.manifest }}")/rendered/final-manifest-$(python - "${{ inputs.manifest }}" "${{ inputs.mode }}" <<'PY'
          import sys
          import json
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{value['video_id']}-{sys.argv[2]}.json")
          PY
          )" \
            --delivery-receipt "${RUNNER_TEMP}/final-delivery.json" \
            --mode "${{ inputs.mode }}" \
            --complete

      - name: Deliver complete final manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
          MODE: ${{ inputs.mode }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          FINAL_MANIFEST="$(dirname "${MANIFEST}")/rendered/final-manifest-$(python - "${MANIFEST}" "${MODE}" <<'PY'
          import sys
          import json
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{value['video_id']}-{sys.argv[2]}.json")
          PY
          )"
          python production/google_drive_delivery.py \
            --collection "VIDEOS V2" \
            --delivery-name "render-${JOB_ID}-${MODE}" \
            --job-id "${JOB_ID}" \
            --path "${FINAL_MANIFEST}" \
            --receipt "${RUNNER_TEMP}/complete-delivery.json"

      - name: Evaluate final canonical gates
        env:
          MANIFEST: ${{ inputs.manifest }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          FINAL_MANIFEST="$(dirname "${MANIFEST}")/rendered/final-manifest-$(python - "${MANIFEST}" "${MODE}" <<'PY'
          import sys
          import json
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{value['video_id']}-{sys.argv[2]}.json")
          PY
          )"
          python production/quality_gates.py \
            --manifest "${MANIFEST}" \
            --mode "${MODE}" \
            --phase final \
            --release-report "$(dirname "${MANIFEST}")/rendered/video-release-${MODE}.json" \
            --delivery-receipt "${RUNNER_TEMP}/complete-delivery.json" \
            --final-manifest "${FINAL_MANIFEST}" \
            --cleanup-receipt "${RUNNER_TEMP}/final-delivery.json" \
            --report "$(dirname "${MANIFEST}")/rendered/quality-gates-final.json"

      - name: Deliver final canonical gate report
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python production/google_drive_delivery.py \
            --collection "VIDEOS V2" \
            --delivery-name "render-${JOB_ID}-${{ inputs.mode }}" \
            --job-id "${JOB_ID}" \
            --path "$(dirname "${{ inputs.manifest }}")/rendered/quality-gates-final.json" \
            --receipt "${RUNNER_TEMP}/gate-delivery.json"

      - name: Mark pipeline complete
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition COMPLETE --stage complete

      - name: Quarantine failed v2 job
        if: failure()
        run: |
          python production/pipeline_state.py             --manifest "${{ inputs.manifest }}"             --transition QUARANTINED             --stage failure || true

