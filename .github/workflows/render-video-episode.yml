name: Render video-only episode v2

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "v2 episode manifest path"
        required: true
        type: string
      mode:
        description: "Render size"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - final

permissions:
  contents: read

concurrency:
  group: because-of-this-v2-${{ inputs.manifest }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install static FFmpeg with retries
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ffmpeg"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
            --output "${RUNNER_TEMP}/ffmpeg.tar.xz"
          tar -xJf "${RUNNER_TEMP}/ffmpeg.tar.xz" -C "${RUNNER_TEMP}/ffmpeg"
          FFMPEG_DIR="$(find "${RUNNER_TEMP}/ffmpeg" -maxdepth 1 -mindepth 1 -type d -name 'ffmpeg-*static' -print -quit)"
          test -n "${FFMPEG_DIR}"
          echo "${FFMPEG_DIR}" >> "${GITHUB_PATH}"
          "${FFMPEG_DIR}/ffmpeg" -version | head -n 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize stable job state
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python production/pipeline_state.py --manifest "${MANIFEST}" --initialize
          JOB_ID="$(python - "${MANIFEST}" <<'PY'
          import sys
          import json
          from pathlib import Path
          from production.pipeline_state import job_id_from_manifest
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(job_id_from_manifest(value))
          PY
          )"
          echo "JOB_ID=${JOB_ID}" >> "${GITHUB_ENV}"

      - name: Run engine regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Google Drive delivery destination
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python production/google_drive_delivery.py --preflight

      - name: Hydrate approved video assets from Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python production/google_drive_assets.py --manifest "${{ inputs.manifest }}" --require-drive-assets

      - name: Generate narration with Google Gemini TTS (streaming REST)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_TIMEOUT_SECONDS: "180"
          GEMINI_TTS_TRANSPORT: "rest_stream"
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          MODEL="$(python - "${EPISODE_DIR}/manifest.json" <<'PY'
          import json
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          print(value["voice"]["model"])
          PY
          )"
          VOICE="$(python - "${EPISODE_DIR}/manifest.json" <<'PY'
          import json
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          print(value["voice"]["voice"])
          PY
          )"
          STYLE="$(python - "${EPISODE_DIR}/manifest.json" <<'PY'
          import json
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          print(value["voice"]["style"])
          PY
          )"
          python narrate.py \
            --input "${EPISODE_DIR}/script.txt" \
            --output "${EPISODE_DIR}/audio/narration.wav" \
            --model "${MODEL}" \
            --voice "${VOICE}" \
            --style "${STYLE}" \
            --overwrite


      - name: Install Vosk forced-alignment model
        run: |
          set -euo pipefail
          MODEL_ROOT="${RUNNER_TEMP}/vosk"
          mkdir -p "${MODEL_ROOT}"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            --output "${MODEL_ROOT}/model.zip"
          unzip -q "${MODEL_ROOT}/model.zip" -d "${MODEL_ROOT}"
          test -d "${MODEL_ROOT}/vosk-model-small-en-us-0.15"
          echo "VOSK_MODEL_DIR=${MODEL_ROOT}/vosk-model-small-en-us-0.15" >> "${GITHUB_ENV}"

      # generate_phrase_captions.py remains the phrase-segmentation helper; timing is now forced from the final WAV.
      - name: Generate forced-aligned captions from final narration
        run: |
          set -euo pipefail
          python production/align_captions.py \
            --manifest "${{ inputs.manifest }}" \
            --model-dir "${VOSK_MODEL_DIR}"

      - name: Mark assets approved
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition ASSETS_APPROVED --stage assets

      - name: Run strict caption QA
        run: |
          EXTRA=""
          if [ "${{ inputs.mode }}" = "final" ]; then
            EXTRA="--require-word-level"
          fi
          python production/caption_quality.py \
            --manifest "${{ inputs.manifest }}" \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/caption-quality-${{ inputs.mode }}.json" \
            ${EXTRA}
      - name: Evaluate canonical gates before render
        run: |
          python production/quality_gates.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --phase pre-render \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/quality-gates-pre-render.json"

      - name: Validate v2 video contract
        run: python production/render_video_episode.py --manifest "${{ inputs.manifest }}" --mode "${{ inputs.mode }}" --validate-only

      - name: Mark timeline ready
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition TIMELINE_READY --stage timeline

      - name: Render narration-locked episode
        run: python production/render_video_episode.py --manifest "${{ inputs.manifest }}" --mode "${{ inputs.mode }}"

      - name: Mark render complete
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition RENDERED --stage render

      - name: Validate release media, captions and reuse gates
        run: |
          python production/validate_video_release.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/video-release-${{ inputs.mode }}.json"
      - name: Evaluate canonical gates after render QA
        run: |
          python production/quality_gates.py \
            --manifest "${{ inputs.manifest }}" \
            --mode "${{ inputs.mode }}" \
            --phase post-render \
            --release-report "$(dirname "${{ inputs.manifest }}")/rendered/video-release-${{ inputs.mode }}.json" \
            --report "$(dirname "${{ inputs.manifest }}")/rendered/quality-gates-post-render.json"

      - name: Mark QA passed
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition QA_PASSED --stage qa

      - name: Publish v2 validation receipt
        if: always()
        run: |
          REPORT="$(dirname "${{ inputs.manifest }}")/rendered/video-release-${{ inputs.mode }}.json"
          {
            echo "## Because of This — v2 validation receipt"
            if [ -f "${REPORT}" ]; then
              python - "${REPORT}" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("status", "job_id", "video_id", "mode", "duration_seconds", "dimensions", "codec", "technical_qa", "caption_gate", "provenance_gate", "post_render_sync"):
              print(f"- {key}: {report.get(key)}")
          PY
            else
              echo "- status: no v2 validation receipt was produced"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Deliver validated v2 production to Google Drive
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python production/google_drive_delivery.py \
            --collection "VIDEOS V2" \
            --delivery-name "render-${JOB_ID}-${{ inputs.mode }}" \
            --job-id "${JOB_ID}" \
            --path "$(dirname "${{ inputs.manifest }}")/rendered" \
            --path "${{ inputs.manifest }}" \
            --receipt "${RUNNER_TEMP}/drive-delivery.json"

      - name: Mark delivery verified
        run: |
          python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition DELIVERED --stage delivery
          python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition DELIVERY_VERIFIED --stage delivery-verification

      - name: Write final reproducibility manifest
        run: |
          python production/finalize_manifest.py \
            --manifest "${{ inputs.manifest }}" \
            --release-report "$(dirname "${{ inputs.manifest }}")/rendered/video-release-${{ inputs.mode }}.json" \
            --delivery-receipt "${RUNNER_TEMP}/drive-delivery.json" \
            --mode "${{ inputs.mode }}"

      - name: Deliver final reproducibility manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
          MODE: ${{ inputs.mode }}
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          FINAL_MANIFEST="$(dirname "${MANIFEST}")/rendered/final-manifest-$(python - "${MANIFEST}" "${MODE}" <<'PY'
          import sys
          import json
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{value['video_id']}-{sys.argv[2]}.json")
          PY
          )"
          python production/google_drive_delivery.py \
            --collection "VIDEOS V2" \
            --delivery-name "render-${JOB_ID}-${MODE}" \
            --job-id "${JOB_ID}" \
            --path "${FINAL_MANIFEST}" \
            --receipt "${RUNNER_TEMP}/final-delivery.json"

      - name: Remove ephemeral media only after verified Drive delivery
        if: success()
        run: |
          set -euo pipefail
          EPISODE_DIR="$(dirname "${{ inputs.manifest }}")"
          test -s "${RUNNER_TEMP}/final-delivery.json"
          grep -q '"status": "DRIVE_VERIFIED"' "${RUNNER_TEMP}/final-delivery.json"
          find "${EPISODE_DIR}" -type f \( -path "*/rendered/*.mp4" -o -path "*/rendered/*.mov" -o -path "*/rendered/*.mkv" -o -path "*/runtime-assets/*.mp4" -o -path "*/runtime-assets/*.mov" -o -path "*/runtime-assets/*.mkv" \) -delete
          echo "v2 media delivered and verified in Google Drive; scoped runner-local media removed." >> "${GITHUB_STEP_SUMMARY}"
          python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition CLEANED --stage cleanup

      - name: Mark final manifest complete after cleanup
        run: |
          python production/finalize_manifest.py \
            --manifest "$(dirname "${{ inputs.manifest }}")/rendered/final-manifest-$(python - "${{ inputs.manifest }}" "${{ inputs.mode }}" <<'PY'
          import sys
          import json
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{value['video_id']}-{sys.argv[2]}.json")
          PY
          )" \
            --delivery-receipt "${RUNNER_TEMP}/final-delivery.json" \
            --mode "${{ inputs.mode }}" \
            --complete

      - name: Deliver complete final manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
          MODE: ${{ inputs.mode }}
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          FINAL_MANIFEST="$(dirname "${MANIFEST}")/rendered/final-manifest-$(python - "${MANIFEST}" "${MODE}" <<'PY'
          import sys
          import json
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{value['video_id']}-{sys.argv[2]}.json")
          PY
          )"
          python production/google_drive_delivery.py \
            --collection "VIDEOS V2" \
            --delivery-name "render-${JOB_ID}-${MODE}" \
            --job-id "${JOB_ID}" \
            --path "${FINAL_MANIFEST}" \
            --receipt "${RUNNER_TEMP}/complete-delivery.json"

      - name: Evaluate final canonical gates
        env:
          MANIFEST: ${{ inputs.manifest }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          FINAL_MANIFEST="$(dirname "${MANIFEST}")/rendered/final-manifest-$(python - "${MANIFEST}" "${MODE}" <<'PY'
          import sys
          import json
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{value['video_id']}-{sys.argv[2]}.json")
          PY
          )"
          python production/quality_gates.py \
            --manifest "${MANIFEST}" \
            --mode "${MODE}" \
            --phase final \
            --release-report "$(dirname "${MANIFEST}")/rendered/video-release-${MODE}.json" \
            --delivery-receipt "${RUNNER_TEMP}/complete-delivery.json" \
            --final-manifest "${FINAL_MANIFEST}" \
            --cleanup-receipt "${RUNNER_TEMP}/final-delivery.json" \
            --report "$(dirname "${MANIFEST}")/rendered/quality-gates-final.json"

      - name: Deliver final canonical gate report
        env:
          BECAUSE_OF_THIS_DRIVE_FOLDER_ID: "1A-oyowfHtdciB2_NZSLIZ0oG-ajOeYVb"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python production/google_drive_delivery.py \
            --collection "VIDEOS V2" \
            --delivery-name "render-${JOB_ID}-${{ inputs.mode }}" \
            --job-id "${JOB_ID}" \
            --path "$(dirname "${{ inputs.manifest }}")/rendered/quality-gates-final.json" \
            --receipt "${RUNNER_TEMP}/gate-delivery.json"

      - name: Mark pipeline complete
        run: python production/pipeline_state.py --manifest "${{ inputs.manifest }}" --transition COMPLETE --stage complete

